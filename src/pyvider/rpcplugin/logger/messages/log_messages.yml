plog:
  messages:
    - domain: "crypto"
      level: "debug"
      action: "certificate_create_start"
      message: "📜📝🚀 CertificateBase.create: Starting certificate base creation."

    - domain: "crypto"
      level: "debug"
      action: "certificate_generate_rsa_key"
      message: "📜🔑🚀 CertificateBase.create: Generating RSA key (size: {key_size})."

    - domain: "crypto"
      level: "error"
      action: "certificate_invalid_key_type"
      message: "📜❌ CertificateBase.create: Unsupported key type: {key_type}"

    - domain: "handshake"
      level: "debug"
      action: "validate_transport_start"
      message: "🤝🚂🔍 Checking transport: {transport_name} against supported list: {supported_transports}"

    - domain: "handshake"
      level: "error"
      action: "protocol_negotiation_failed"
      message: "🤝❌ Protocol negotiation failed: No compatible version found."

    - domain: "transport"
      level: "info"
      action: "tcp_listening"
      message: "🔌✅👍 TCP server listening at {endpoint}"

    - domain: "transport"
      level: "error"
      action: "tcp_bind_failed"
      message: "🔌❌⚠ Failed to bind TCP server: {error}"

    - domain: "transport"
      level: "debug"
      action: "tcp_client_connected"
      message: "🔌🤝👀 New client connected from {client_info}"
