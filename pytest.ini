[pytest]
testpaths = tests
pythonpath = src
addopts = -v --tb=short
markers =
    slow: marks tests as slow running
filterwarnings =
    ignore::pytest.PytestCollectionWarning:.*cannot collect test class.*TestRequest.*
    ignore::pytest.PytestCollectionWarning:.*cannot collect test class.*TestResponse.*
    ignore::pytest.PytestCollectionWarning:.*cannot collect test class.*TestStub.*
    ignore::UserWarning
    ignore::RuntimeWarning:_pytest.runner