    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Your First Plugin: getting-started/first-plugin.md
    - Examples Overview: getting-started/examples.md
  
  - User Guide:
    - guide/index.md
    - Core Concepts:
      - guide/concepts/index.md
      - RPC Architecture: guide/concepts/rpc-architecture.md
      - Transports: guide/concepts/transports.md
      - Protocols: guide/concepts/protocols.md
      - Handshake Process: guide/concepts/handshake.md
      - Security Model: guide/concepts/security.md
    
    - Server Development:
      - guide/server/index.md
      - Basic Server Setup: guide/server/basic-setup.md
      - Service Implementation: guide/server/services.md
      - Transport Configuration: guide/server/transports.md
      - Async Patterns: guide/server/async-patterns.md
      - Health Checks: guide/server/health-checks.md
    
    - Client Development:
      - guide/client/index.md
      - Basic Client Setup: guide/client/basic-setup.md
      - Connection Management: guide/client/connections.md
      - Direct Connections: guide/client/direct-connections.md
      - Error Handling: guide/client/error-handling.md
      - Retry Logic: guide/client/retry-logic.md
    
    - Security:
      - guide/security/index.md
      - mTLS Configuration: guide/security/mtls.md
      - Certificate Management: guide/security/certificates.md
      - Certificate API Reference: guide/security/certificate-reference.md
      - Magic Cookies: guide/security/magic-cookies.md
      - Process Isolation: guide/security/process-isolation.md
    
    - Configuration:
      - guide/config/index.md
      - Configuration Reference: guide/config/configuration-reference.md
      - Config vs Factory Parameters: guide/config/configuration-vs-factory-parameters.md
      - Client Configuration: guide/config/configuration-client.md
      - Server Configuration: guide/config/configuration-server.md
      - Security Configuration: guide/config/configuration-security.md
      - Advanced Configuration: guide/config/configuration-advanced.md
      - Environment Variables: guide/config/environment.md
      - Production Setup: guide/config/production.md
      - Rate Limiting: guide/config/rate-limiting.md
      - Logging Configuration: guide/config/logging.md
    
    - Advanced Topics:
      - guide/advanced/index.md
      - Type System: guide/advanced/type-system.md
      - Custom Protocols: guide/advanced/custom-protocols.md
      - Performance Tuning: guide/advanced/performance.md
      - Telemetry & Observability: guide/advanced/telemetry.md
      - Middleware: guide/advanced/middleware.md
      - Plugin Lifecycle: guide/advanced/lifecycle.md

    - Best Practices: guide/best-practices.md

  - API Reference:
    - reference/
  
  - Examples:
    - examples/index.md
    - Echo Service Examples:
      - Basic Echo: examples/echo-basic.md
      - Intermediate Patterns: examples/echo-intermediate.md
      - Advanced Patterns: examples/echo-advanced.md
    - Short Examples:
      - Basic Client: examples/short/basic-client.md
      - Basic Server: examples/short/basic-server.md
      - Health Check: examples/short/health-check.md
      - Rate Limiting: examples/short/rate-limiting.md
      - TCP Transport: examples/short/tcp-transport.md
      - Custom Protocol: examples/short/custom-protocol.md
  
  - Development:
    - development/index.md
    - Contributing: development/contributing.md
    - Architecture: development/architecture.md
    - Testing: development/testing.md
    - CI/CD: development/ci-cd.md
    - Troubleshooting: development/troubleshooting.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

watch:
  - src/pyvider
  - docs
  - mkdocs.yml