[mypy]
python_version = 3.13
mypy_path = src:examples/demo:examples/kvproto/py_rpc/proto
explicit_package_bases = True
namespace_packages = True
show_error_codes = True

# Ignore errors from generated protobuf files if they cause issues
[mypy-echo_pb2]
ignore_errors = True
[mypy-echo_pb2_grpc]
ignore_errors = True
[mypy-kv_pb2]
ignore_errors = True
[mypy-kv_pb2_grpc]
ignore_errors = True
