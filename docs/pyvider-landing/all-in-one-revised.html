<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Particle Effects</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    #zdog-canvas {
      display: block;
      width: 100%;
      height: 100vh;
      cursor: default;
      touch-action: none;
    }

    .controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      z-index: 100;
      font-family: monospace;
      font-size: 12px;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="zdog-canvas"></canvas>
  <div class="controls">
    Mouse: Click to highlight, Drag to move, Scroll to zoom
  </div>
  
  <script src="https://unpkg.com/zdog@1/dist/zdog.dist.min.js"></script>
  <script>
    // All code combined into one file to avoid module issues
    
    // =============== ASCII ART DATA ===============
    const asciiArt = `
                                                          ::
                                                        *:@@:%
                                                        ::  ::
               :::-=-:::::                              : ::
           :::%@:@%:::::::=:                            ::  ::
          ==::::::::::::=#=:=                          :*:  ::::  :#*.  ##:::##:#:=*:::=:::::::.
           @@@@@@@@@@@@@@@=:==                      ::  . :: :  ::    : :  : :  :  : : :::: :: :
                        @#=-=@                        ::::  ::::  :::: ::::::::::::::::::::::::
                        **===@                         ::.  ::                       :#:=:
                       =@*=*@:                         :  :: :
                     :+@@@@@@                          :::  ::
                    :%@@@@@=                           ::::::::
                   :@@@@@@:                            : :   ::
                 ::@@@@@@                    ==        :     ::                       :::
                :=@@@@@@          :====-      :=:      ::. .:::                       :@:
               :*@@@@@=        .:::::::::=     :=:     :::  :::                        ::
          ::-===@@@@@=       ::::::::::@@%      :=:    :  ::  :                        *
         %::::::::=@@.    .::::::::=@@@@*=*=.   ==@    ::    ::                       @:@
         @@:::::::::::::::::::::-@@@@==::::==*  ==@    :::  :::
       :::*@@@=-:::::::::::::=*@@@*=::::::::=* :*@=    :  ::  :            ########@@######@@######
      :::::::@@@@@@*=====+%@@@@+=::::::::=%@@@@@@@     : :  : :            ######@@##########%@####
      *:::::::::=*@@@@@@@@#=:::::::::::+@@@@@@@@@     .#:::::::
       @@*:::::::::::::::::::::::::::*@@@@@@@@@@      ::.:  . :
         =@@@@@*::::::::::::::-*@@@@@@@@@@@@@.        ::  ::  :
                  :#@@@@@@@@@=.                       :::    ::
`;

    // Parse ASCII art into a 2D array
    function parseAsciiArt() {
      return asciiArt
        .split('\n')
        .filter(line => line.length > 0) // Remove empty lines
        .map(line => [...line]);
    }

    // Get grid dimensions
    function getGridDimensions(grid) {
      return {
        width: Math.max(...grid.map(row => row.length)),
        height: grid.length
      };
    }

    // Get character groups
    function getCharacterGroups() {
      return {
        box: ['@', '#', '%'],
        star: ['*', '+'],
        line: ['-', '='],
        dot: ['.', ':'],
        other: ['\\', '/', '|', '_']
      };
    }

    // =============== UTILS ===============
    function getColorMap() {
      return {
        ':': '#55FFFF',  // Cyan
        '@': '#FF55FF',  // Magenta
        '=': '#FFFF55',  // Yellow
        '-': '#55FF55',  // Green
        '+': '#FF5555',  // Red
        '%': '#5555FF',  // Blue
        '.': '#FFFFFF',  // White
        '#': '#FF8800',  // Orange
        '*': '#00FF88',  // Mint
        default: '#FFFFFF' // Default white
      };
    }

    function getCharColor(char) {
      const colorMap = getColorMap();
      return colorMap[char] || colorMap.default;
    }

    function getColorVariant(color, factor) {
      const r = parseInt(color.slice(1, 3), 16);
      const g = parseInt(color.slice(3, 5), 16);
      const b = parseInt(color.slice(5, 7), 16);
      
      const adjustColor = (c) => {
        const adjusted = Math.floor(c * factor);
        return Math.min(255, Math.max(0, adjusted));
      };
      
      return `#${
        adjustColor(r).toString(16).padStart(2, '0')
      }${
        adjustColor(g).toString(16).padStart(2, '0')
      }${
        adjustColor(b).toString(16).padStart(2, '0')
      }`;
    }

    function getPointerPosition(event) {
      if (event.type.startsWith('touch')) {
        event.preventDefault();
      }
      
      const x = event.touches ? event.touches[0].clientX : event.clientX;
      const y = event.touches ? event.touches[0].clientY : event.clientY;
      return { x, y };
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // =============== EFFECTS ===============
    const effects = {
      float: (particle, time) => {
        particle.group.translate.x = particle.originalX + 
                                    Math.sin(time * particle.speed + particle.phase) * particle.radius;
        particle.group.translate.y = particle.originalY + 
                                    Math.cos(time * particle.speed + particle.phase) * particle.radius;
      },
      
      rotate: (particle, time) => {
        particle.group.rotate.z = Math.sin(time * particle.speed) * 0.3;
        particle.group.rotate.x = Math.cos(time * particle.speed) * 0.2;
      },
      
      pulse: (particle, time) => {
        const scale = 0.8 + Math.sin(time * particle.speed) * 0.2;
        particle.group.scale.x = scale;
        particle.group.scale.y = scale;
        particle.group.scale.z = scale;
      },
      
      orbit: (particle, time) => {
        particle.group.translate.z = particle.originalZ + 
                                   Math.sin(time * particle.speed + particle.phase) * particle.radius;
      },
      
      wave: (particle, time) => {
        particle.group.translate.y = particle.originalY + 
                                   Math.sin(time * 0.5 + particle.originalX * 0.05) * particle.amplitude;
      },
      
      glow: (particle, time) => {
        const pulseScale = 1 + Math.sin(time * particle.speed) * 0.1;
        particle.shape.color = particle.highlighted ? 
                              '#FFFFFF' : 
                              getColorVariant(particle.originalColor, 0.8 + Math.sin(time * 0.5) * 0.2);
      },
      
      bounce: (particle, time) => {
        particle.group.translate.y = particle.originalY + 
                                   Math.abs(Math.sin(time * particle.speed)) * particle.amplitude;
      },
      
      throb: (particle, time) => {
        // Subtle throbbing effect
        const baseScale = 1.0;
        const pulseAmount = 0.1;
        const scale = baseScale + Math.sin(time * 0.4 + particle.phase * 3) * pulseAmount;
        
        particle.group.scale.x = scale;
        particle.group.scale.y = scale;
        particle.group.scale.z = scale;
      }
    };

    function getEffectForChar(char) {
      // Return the default effect for each character
      return 'throb';
    }

    // =============== EXTRUDED TEXT CREATOR ===============
    class ExtrudedTextCreator {
      constructor() {
        // Font definitions for ASCII characters
        // Using simple line segment definitions
        this.fontDefinitions = this.createFontDefinitions();
      }
      
      createFontDefinitions() {
        // Define paths for common ASCII characters using line segments
        const definitions = {};
        
        // Define @ character
        definitions['@'] = [
          // Outer circle
          { x: 0, y: -0.5 }, { x: 0.5, y: -0.5 }, { x: 0.5, y: 0.5 }, 
          { x: -0.5, y: 0.5 }, { x: -0.5, y: -0.5 }, { x: 0, y: -0.5 },
          // Inner 'a' like shape 
          { move: { x: 0.25, y: 0 } },
          { x: 0, y: 0 }, { x: 0, y: 0.25 }, { x: 0.25, y: 0.25 },
          { x: 0.25, y: -0.25 }, { x: 0, y: -0.25 }
        ];
        
        // Define # character
        definitions['#'] = [
          // Horizontal lines
          { x: -0.5, y: -0.2 }, { x: 0.5, y: -0.2 },
          { move: { x: -0.5, y: 0.2 } }, { x: 0.5, y: 0.2 },
          // Vertical lines
          { move: { x: -0.2, y: -0.5 } }, { x: -0.2, y: 0.5 },
          { move: { x: 0.2, y: -0.5 } }, { x: 0.2, y: 0.5 }
        ];
        
        // Define * character
        definitions['*'] = [
          // Star shape
          { x: 0, y: 0 }, { x: 0, y: -0.5 },
          { move: { x: 0, y: 0 } }, { x: 0.4, y: -0.3 },
          { move: { x: 0, y: 0 } }, { x: 0.5, y: 0 },
          { move: { x: 0, y: 0 } }, { x: 0.4, y: 0.3 },
          { move: { x: 0, y: 0 } }, { x: 0, y: 0.5 },
          { move: { x: 0, y: 0 } }, { x: -0.4, y: 0.3 },
          { move: { x: 0, y: 0 } }, { x: -0.5, y: 0 },
          { move: { x: 0, y: 0 } }, { x: -0.4, y: -0.3 }
        ];
        
        // Define + character
        definitions['+'] = [
          { x: -0.5, y: 0 }, { x: 0.5, y: 0 },
          { move: { x: 0, y: -0.5 } }, { x: 0, y: 0.5 }
        ];
        
        // Define : character
        definitions[':'] = [
          { x: 0, y: -0.3 }, { x: 0, y: -0.3 },
          { move: { x: 0, y: 0.3 } }, { x: 0, y: 0.3 }
        ];
        
        // Define = character
        definitions['='] = [
          { x: -0.5, y: -0.2 }, { x: 0.5, y: -0.2 },
          { move: { x: -0.5, y: 0.2 } }, { x: 0.5, y: 0.2 }
        ];
        
        // Define - character
        definitions['-'] = [
          { x: -0.5, y: 0 }, { x: 0.5, y: 0 }
        ];
        
        // Define % character
        definitions['%'] = [
          // Diagonal line
          { x: -0.5, y: 0.5 }, { x: 0.5, y: -0.5 },
          // Top right circle
          { move: { x: 0.3, y: -0.3 } }, { x: 0.3, y: -0.3 },
          // Bottom left circle
          { move: { x: -0.3, y: 0.3 } }, { x: -0.3, y: 0.3 }
        ];
        
        // Define . character
        definitions['.'] = [
          { x: 0, y: 0.4 }, { x: 0, y: 0.4 }
        ];
        
        // Default for any undefined character
        definitions['default'] = [
          { x: -0.4, y: -0.4 }, { x: 0.4, y: -0.4 }, 
          { x: 0.4, y: 0.4 }, { x: -0.4, y: 0.4 }, 
          { x: -0.4, y: -0.4 }
        ];
        
        return definitions;
      }
      
      // Create an extruded text shape for a character
      createExtrudedChar(char, group, size, depth) {
        const path = this.fontDefinitions[char] || this.fontDefinitions['default'];
        const color = getCharColor(char);
        
        // Create the main extruded shape
        const frontGroup = new Zdog.Group({
          addTo: group
        });
        
        // Front face
        const frontShape = new Zdog.Shape({
          addTo: frontGroup,
          path: path,
          stroke: 2,
          color: color,
          fill: true,
          closed: this.isClosedPath(path),
          scale: size
        });
        
        // Back face (positioned back by depth)
        const backShape = new Zdog.Shape({
          addTo: frontGroup,
          path: path,
          stroke: 2,
          color: getColorVariant(color, 0.7),
          fill: true,
          closed: this.isClosedPath(path),
          scale: size,
          translate: { z: -depth }
        });
        
        // Create side faces to connect front and back (extrusion)
        this.createSideFaces(path, frontGroup, size, depth, color);
        
        return {
          group: frontGroup,
          color: color
        };
      }
      
      // Create the side faces for extrusion
      createSideFaces(path, group, size, depth, color) {
        // Skip if path is too simple
        if (path.length < 2) return;
        
        const darkColor = getColorVariant(color, 0.6);
        const mediumColor = getColorVariant(color, 0.8);
        
        // Create sides by connecting corresponding points on front and back faces
        for (let i = 0; i < path.length - 1; i++) {
          const current = path[i];
          const next = path[i + 1];
          
          // Skip if this is a move command
          if (current.move || next.move) continue;
          
          // Create a side panel by defining the 4 corners
          const sidePath = [
            { x: current.x * size, y: current.y * size, z: 0 },
            { x: next.x * size, y: next.y * size, z: 0 },
            { x: next.x * size, y: next.y * size, z: -depth },
            { x: current.x * size, y: current.y * size, z: -depth }
          ];
          
          // Create the side panel
          new Zdog.Shape({
            addTo: group,
            path: sidePath,
            color: (i % 2 === 0) ? darkColor : mediumColor, // Alternate colors for cell-shading effect
            fill: true,
            closed: true,
            stroke: 1
          });
        }
      }
      
      // Check if the path should be closed
      isClosedPath(path) {
        if (path.length < 3) return false;
        
        // If any segment is a move command, the path is not inherently closed
        const hasMoveCommands = path.some(point => point.move);
        if (hasMoveCommands) return false;
        
        // Check if the first and last points are the same (closed shape)
        const first = path[0];
        const last = path[path.length - 1];
        return (first.x === last.x && first.y === last.y);
      }
    }

    // =============== PARTICLE MANAGER ===============
    class ParticleManager {
      constructor(illo, asciiGrid) {
        this.illo = illo;
        this.asciiGrid = asciiGrid;
        this.particles = [];
        this.mainGroup = new Zdog.Group({
          addTo: this.illo
        });
        this.characterGroups = getCharacterGroups();
        this.extrudedTextCreator = new ExtrudedTextCreator();
        this.highlightedParticle = null;
      }
      
      createParticles({ scale, offsetX, offsetY }) {
        this.particles = [];
        this.mainGroup.children = [];
        
        this.asciiGrid.forEach((row, y) => {
          row.forEach((char, x) => {
            if (char.trim() !== '') {
              const particle = this.createParticle(char, x, y, scale, offsetX, offsetY);
              this.particles.push(particle);
            }
          });
        });
      }
      
      createParticle(char, x, y, scale, offsetX, offsetY) {
        const group = new Zdog.Group({
          addTo: this.mainGroup,
          translate: {
            x: offsetX + x * scale,
            y: offsetY + y * scale,
            z: 0
          }
        });
        
        // Create extruded character with depth
        const depth = scale * 0.5; // Substantial depth for 3D effect
        const charObj = this.extrudedTextCreator.createExtrudedChar(char, group, scale * 0.4, depth);
        
        const speed = 0.3 + Math.random() * 0.5;
        const phase = Math.random() * Math.PI * 2;
        const radius = 1 + Math.random() * 2;
        const amplitude = 2 + Math.random() * 3;
        
        const effectType = getEffectForChar(char);
        
        // Return the particle object with all properties
        return {
          char,
          group,
          shape: charObj.group,
          originalX: group.translate.x,
          originalY: group.translate.y,
          originalZ: group.translate.z,
          originalColor: charObj.color,
          originalScale: { x: 1, y: 1, z: 1 },
          effect: effectType,
          speed,
          phase,
          radius,
          amplitude,
          highlighted: false,
          x, y // Grid coordinates
        };
      }
      
      updateParticles(time) {
        this.particles.forEach(particle => {
          const updateEffect = effects[particle.effect];
          if (updateEffect) {
            updateEffect(particle, time);
          }
          
          // Add subtle cell-shading effect by modifying z-rotation based on lighting
          particle.group.rotate.z = Math.sin(time * 0.1 + particle.phase) * 0.03;
        });
      }
      
      moveParticles(deltaX, deltaY) {
        this.mainGroup.translate.x += deltaX;
        this.mainGroup.translate.y += deltaY;
      }
      
      zoomParticles(factor) {
        // Don't let the zoom get too small or too large
        const currentScale = this.mainGroup.scale.x;
        const newScale = Math.max(0.2, Math.min(5, currentScale * factor));
        
        this.mainGroup.scale.x = newScale;
        this.mainGroup.scale.y = newScale;
        this.mainGroup.scale.z = newScale;
      }
      
      highlightParticle(x, y) {
        // Reset previous highlight
        if (this.highlightedParticle) {
          this.highlightedParticle.highlighted = false;
          
          // Reset any visual changes
          this.highlightedParticle.group.scale.x = 1;
          this.highlightedParticle.group.scale.y = 1;
          this.highlightedParticle.group.scale.z = 1;
        }
        
        // Find the particle closest to the given coordinates
        const closestParticle = this.findClosestParticle(x, y);
        
        if (closestParticle) {
          // Highlight the new particle
          closestParticle.highlighted = true;
          
          // Make it stand out
          closestParticle.group.scale.x = 1.5;
          closestParticle.group.scale.y = 1.5;
          closestParticle.group.scale.z = 1.5;
          
          this.highlightedParticle = closestParticle;
        }
      }
      
      findClosestParticle(x, y) {
        // Convert screen coordinates to scene coordinates
        const vector = this.screenToScene(x, y);
        
        let closestParticle = null;
        let closestDistance = Infinity;
        
        // Find the closest particle
        this.particles.forEach(particle => {
          const dx = particle.group.translate.x - vector.x;
          const dy = particle.group.translate.y - vector.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          // Check if this particle is closer than the current closest
          if (distance < closestDistance) {
            closestDistance = distance;
            closestParticle = particle;
          }
        });
        
        // Only return if we're reasonably close (adjusted by zoom level)
        const threshold = 50 / this.mainGroup.scale.x;
        return closestDistance < threshold ? closestParticle : null;
      }
      
      screenToScene(screenX, screenY) {
        // Convert screen coordinates to scene coordinates
        // This is a simplified conversion and may need adjustment based on camera setup
        const canvas = this.illo.element;
        const rect = canvas.getBoundingClientRect();
        
        // Get canvas-relative coordinates
        const canvasX = screenX - rect.left;
        const canvasY = screenY - rect.top;
        
        // Convert to scene coordinates (centered on canvas)
        const sceneX = (canvasX - canvas.width / 2) / this.mainGroup.scale.x;
        const sceneY = (canvasY - canvas.height / 2) / this.mainGroup.scale.y;
        
        // Adjust for any global translations
        const adjustedX = sceneX - this.mainGroup.translate.x;
        const adjustedY = sceneY - this.mainGroup.translate.y;
        
        return { x: sceneX, y: sceneY };
      }
    }

    // =============== MAIN APP ===============
    class AsciiParticleApp {
      constructor() {
        this.asciiGrid = parseAsciiArt();
        this.gridDimensions = getGridDimensions(this.asciiGrid);
        
        this.canvas = document.getElementById('zdog-canvas');
        this.isDragging = false;
        this.lastX = 0;
        this.lastY = 0;
        this.zoomLevel = 1;
        this.previousTime = 0;
        
        this.setupZdog();
        this.setupParticles();
        this.setupEventListeners();
        this.animate();
        
        console.log('ASCII Particle App initialized', {
          gridDimensions: this.gridDimensions,
          particleCount: this.particleManager.particles.length
        });
      }
      
      setupZdog() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        
        this.illo = new Zdog.Illustration({
          element: this.canvas,
          dragRotate: false,
          resize: true,
          zoom: 1,
        });
      }
      
      setupParticles() {
        const padding = 40;
        const scaleX = (window.innerWidth - padding * 2) / this.gridDimensions.width;
        const scaleY = (window.innerHeight - padding * 2) / this.gridDimensions.height;
        const scale = Math.min(scaleX, scaleY) * 0.8;
        
        const offsetX = -this.gridDimensions.width * scale / 2;
        const offsetY = -this.gridDimensions.height * scale / 2;
        
        this.particleManager = new ParticleManager(this.illo, this.asciiGrid);
        this.particleManager.createParticles({ scale, offsetX, offsetY });
      }
      
      setupEventListeners() {
        // Mouse interactions
        this.canvas.addEventListener('mousedown', this.handleMouseDown.bind(this));
        window.addEventListener('mousemove', this.handleMouseMove.bind(this));
        window.addEventListener('mouseup', this.handleMouseUp.bind(this));
        
        // Touch interactions
        this.canvas.addEventListener('touchstart', this.handleMouseDown.bind(this), { passive: false });
        window.addEventListener('touchmove', this.handleMouseMove.bind(this), { passive: false });
        window.addEventListener('touchend', this.handleMouseUp.bind(this));
        
        // Zoom with mouse wheel
        this.canvas.addEventListener('wheel', this.handleWheel.bind(this), { passive: false });
        
        // Window resize
        window.addEventListener('resize', debounce(this.handleResize.bind(this), 250));
        
        // Prevent right-click menu
        this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      }
      
      handleMouseDown(event) {
        event.preventDefault();
        
        const pointer = getPointerPosition(event);
        this.lastX = pointer.x;
        this.lastY = pointer.y;
        
        // If it's a left click, highlight a particle
        if (event.button === 0 || event.touches) {
          this.particleManager.highlightParticle(pointer.x, pointer.y);
        }
        
        this.isDragging = true;
      }
      
      handleMouseMove(event) {
        if (!this.isDragging) return;
        
        const pointer = getPointerPosition(event);
        const deltaX = (pointer.x - this.lastX) / this.zoomLevel;
        const deltaY = (pointer.y - this.lastY) / this.zoomLevel;
        
        // Move the particles
        this.particleManager.moveParticles(deltaX, deltaY);
        
        this.lastX = pointer.x;
        this.lastY = pointer.y;
      }
      
      handleMouseUp() {
        this.isDragging = false;
      }
      
      handleWheel(event) {
        event.preventDefault();
        
        // Determine zoom direction
        const zoomFactor = event.deltaY < 0 ? 1.1 : 0.9;
        
        // Update zoom level
        this.zoomLevel *= zoomFactor;
        
        // Apply zoom to particles
        this.particleManager.zoomParticles(zoomFactor);
      }
      
      handleResize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        
        this.setupParticles();
      }
      
      animate(timestamp = 0) {
        const time = timestamp / 1000;
        
        // Update all particles
        this.particleManager.updateParticles(time);
        
        // Update the scene
        this.illo.updateRenderGraph();
        
        // Continue animation loop
        requestAnimationFrame(this.animate.bind(this));
      }
    }

    // Initialize when the document is ready
    document.addEventListener('DOMContentLoaded', () => {
      window.app = new AsciiParticleApp();
    });
  </script>
</body>
</html>
