  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.17"></script>
  <script>
    // =============== ASCII ART DATA ===============
    const asciiArt = ```
                                                          ::
                                                        *:@@:%
                                                        ::  ::
               :::-=-:::::                              : :: :
           :::%@:@%:::::::=:                            ::  ::
          ==::::::::::::=#=:=                         ::*:  ::::  :#*=...#=..=##..=*:::=:::::::.
           @@@@@@@@@@@@@@@=:==                      ::  . :: :  ::  : : :  : :  :  : : :::: :: :
                        @#=-=@                        ::::  ::::  :::::::::::::::::::::::::::::
                        **===@                         ::.  ::                       :=@=:
                       =@*=*@:                         :  :: :                       :=@=:
                     :+@@@@@@                          :::  ::                        ::;
                    :%@@@@@=                           ::::::::                       :#:
                   :@@@@@@:                            : :   ::                       :@:
                 ::@@@@@@                    ==        :     ::                       :#:
                :=@@@@@@          :====-      :=:      ::. .:::                       :::
               :*@@@@@=        .:::::::::=     :=:     :::  :::                       `:'
          ::-===@@@@@=       ::::::::::@@%      :=:    :  ::  :                        ^
         %::::::::=@@.    .::::::::=@@@@*=*=.   ==@    ::    ::                       /:\
         @@:::::::::::::::::::::-@@@@==::::==*  ==@    :::  :::                     .@. .@.
       :::*@@@=-:::::::::::::=*@@@*=::::::::=* :*@=    :  ::  :            ########@@######@@######
      :::::::@@@@@@*=====+%@@@@+=::::::::=%@@@@@@@     : :  : :            ######@@##########%@####
      *:::::::::=*@@@@@@@@#=:::::::::::+@@@@@@@@@     .#:::::::
       @@*:::::::::::::::::::::::::::*@@@@@@@@@@      ::.:  . :
         =@@@@@*::::::::::::::-*@@@@@@@@@@@@@.        ::  ::  :
                  :#@@@@@@@@@=.                       :::    ::
```;

    // Parse ASCII art into a 2D array
    function parseAsciiArt() {
      return asciiArt
        .split('\n')
        .filter(line => line.length > 0) // Remove empty lines
        .map(line => [...line]);
    }

    // Get grid dimensions
    function getGridDimensions(grid) {
      return {
        width: Math.max(...grid.map(row => row.length)),
        height: grid.length
      };
    }

    // Get character groups
    function getCharacterGroups() {
      return {
        box: ['@', '#', '%'],
        star: ['*', '+'],
        line: ['-', '='],
        dot: ['.', ':'],
        other: ['\\', '/', '|', '_']
      };
    }

    // =============== UTILS ===============
    function getColorMap() {
      return {
        ':': '#55FFFF',  // Cyan
        '@': '#FF3333',  // Red (was Magenta)
        '=': '#33FF88',  // Alternate Green (was Yellow)
        '-': '#55FF55',  // Green
        '+': '#FF5555',  // Red
        '%': '#5555FF',  // Blue
        '.': '#FFFFFF',  // White
        '#': '#FF8800',  // Orange
        '*': '#00FF88',  // Mint
        default: '#FFFFFF' // Default white
      };
    }

    function getCharColor(char, time = 0, shimmerAmount = 0.6) {
      const colorMap = getColorMap();
      const baseColor = colorMap[char] || colorMap.default;
      
      // Apply a shimmer effect - oscillate between colors
      return shimmerColor(baseColor, time, shimmerAmount);
    }
    
    function shimmerColor(baseColor, time, amount) {
      // Parse base color
      const r = parseInt(baseColor.slice(1, 3), 16);
      const g = parseInt(baseColor.slice(3, 5), 16);
      const b = parseInt(baseColor.slice(5, 7), 16);
      
      // Calculate shimmer offset based on time with higher frequency
      const shimmerR = Math.sin(time * 2.2) * amount * 255;
      const shimmerG = Math.sin(time * 2.7 + 1.3) * amount * 255;
      const shimmerB = Math.sin(time * 3.1 + 2.5) * amount * 255;
      
      // Apply shimmer and clamp values
      const newR = Math.min(255, Math.max(0, r + shimmerR));
      const newG = Math.min(255, Math.max(0, g + shimmerG));
      const newB = Math.min(255, Math.max(0, b + shimmerB));
      
      // Convert back to hex
      return `#${
        Math.floor(newR).toString(16).padStart(2, '0')
      }${
        Math.floor(newG).toString(16).padStart(2, '0')
      }${
        Math.floor(newB).toString(16).padStart(2, '0')
      }`;
    }

    function getColorVariant(color, factor) {
      const r = parseInt(color.slice(1, 3), 16);
      const g = parseInt(color.slice(3, 5), 16);
      const b = parseInt(color.slice(5, 7), 16);
      
      const adjustColor = (c) => {
        const adjusted = Math.floor(c * factor);
        return Math.min(255, Math.max(0, adjusted));
      };
      
      return `#${
        adjustColor(r).toString(16).padStart(2, '0')
      }${
        adjustColor(g).toString(16).padStart(2, '0')
      }${
        adjustColor(b).toString(16).padStart(2, '0')
      }`;
    }

    function getPointerPosition(event) {
      if (event.type.startsWith('touch')) {
        event.preventDefault();
      }
      
      const x = event.touches ? event.touches[0].clientX : event.clientX;
      const y = event.touches ? event.touches[0].clientY : event.clientY;
      return { x, y };
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // =============== PARTICLE EFFECTS ===============
    class ParticleEffects {
      constructor() {
        this.effectTypes = [
          'spin',
          'explode',
          'scatter',
          'wave',
          'pulse'
        ];
        
        this.currentEffectIndex = 0;
      }
      
      // Get current effect
      getCurrentEffect() {
        return this.effectTypes[this.currentEffectIndex];
      }
      
      // Set specific effect
      setEffect(effectName) {
        const index = this.effectTypes.indexOf(effectName);
        if (index !== -1) {
          this.currentEffectIndex = index;
        }
        return this.getCurrentEffect();
      }
      
      // Cycle to next effect
      cycleEffect() {
        this.currentEffectIndex = (this.currentEffectIndex + 1) % this.effectTypes.length;
        return this.getCurrentEffect();
      }
      
      // Apply effect to particles based on mouse interaction
      applyEffect(particles, mouseX, mouseY, intensity = 1.0) {
        const effect = this.getCurrentEffect();
        
        switch(effect) {
          case 'spin':
            this.applySpinEffect(particles, mouseX, mouseY, intensity);
            break;
          case 'explode':
            this.applyExplodeEffect(particles, mouseX, mouseY, intensity);
            break;
          case 'scatter':
            this.applyScatterEffect(particles, mouseX, mouseY, intensity);
            break;
          case 'wave':
            this.applyWaveEffect(particles, mouseX, mouseY, intensity);
            break;
          case 'pulse':
            this.applyPulseEffect(particles, mouseX, mouseY, intensity);
            break;
        }
      }
      
      // Effect: Spin particles around mouse position
      applySpinEffect(particles, mouseX, mouseY, intensity) {
        particles.forEach(particle => {
          // Calculate distance from mouse
          const dx = particle.screenX - mouseX;
          const dy = particle.screenY - mouseY;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          // Only affect particles within a certain radius
          const radius = 200;
          if (distance < radius) {
            // Calculate influence based on distance (closer = stronger)
            const influence = (1 - distance / radius) * intensity;
            
            // Apply a spinning force
            const angle = Math.atan2(dy, dx);
            const spinSpeed = (0.1 + Math.random() * 0.2) * influence;
            
            // Temporarily increase rotation speed based on influence
            particle.tempRotationX = spinSpeed * 5;
            particle.tempRotationY = spinSpeed * 6;
            particle.tempRotationZ = spinSpeed * 4;
          }
        });
      }
      
      // Effect: Push particles away from mouse position
      applyExplodeEffect(particles, mouseX, mouseY, intensity) {
        particles.forEach(particle => {
          // Calculate distance from mouse
          const dx = particle.screenX - mouseX;
          const dy = particle.screenY - mouseY;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          // Only affect particles within a certain radius
          const radius = 150;
          if (distance < radius) {
            // Calculate influence based on distance (closer = stronger)
            const influence = (1 - distance / radius) * intensity;
            
            // Apply an outward force
            const angle = Math.atan2(dy, dx);
            const force = 5 * influence;
            
            // Push away from mouse
            particle.tempOffsetX += Math.cos(angle) * force;
            particle.tempOffsetY += Math.sin(angle) * force;
          }
        });
      }
      
      // Effect: Randomly scatter particles near mouse
      applyScatterEffect(particles, mouseX, mouseY, intensity) {
        particles.forEach(particle => {
          // Calculate distance from mouse
          const dx = particle.screenX - mouseX;
          const dy = particle.screenY - mouseY;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          // Only affect particles within a certain radius
          const radius = 120;
          if (distance < radius) {
            // Calculate influence based on distance (closer = stronger)
            const influence = (1 - distance / radius) * intensity;
            
            // Apply random movement
            const randomX = (Math.random() * 2 - 1) * 8 * influence;
            const randomY = (Math.random() * 2 - 1) * 8 * influence;
            const randomZ = (Math.random() * 2 - 1) * 4 * influence;
            
            // Add temporary offsets
            particle.tempOffsetX += randomX;
            particle.tempOffsetY += randomY;
            particle.tempOffsetZ += randomZ;
          }
        });
      }
      
      // Effect: Create a wave pattern radiating from mouse
      applyWaveEffect(particles, mouseX, mouseY, intensity) {
        const time = Date.now() / 1000;
        
        particles.forEach(particle => {
          // Calculate distance from mouse
          const dx = particle.screenX - mouseX;
          const dy = particle.screenY - mouseY;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          // Create a wave pattern based on distance
          const radius = 250;
          if (distance < radius) {
            const wave = Math.sin(distance * 0.05 - time * 3) * 8 * intensity;
            const influence = (1 - distance / radius);
            
            // Apply wave displacement
            particle.tempOffsetZ += wave * influence;
          }
        });
      }
      
      // Effect: Create a pulsing size effect
      applyPulseEffect(particles, mouseX, mouseY, intensity) {
        particles.forEach(particle => {
          // Calculate distance from mouse
          const dx = particle.screenX - mouseX;
          const dy = particle.screenY - mouseY;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          // Only affect particles within a certain radius
          const radius = 180;
          if (distance < radius) {
            // Calculate pulse scale based on distance
            const influence = (1 - distance / radius) * intensity;
            const pulse = 1 + influence;
            
            // Apply scale
            particle.tempScale = pulse;
          }
        });
      }
    }

    // =============== EXTRUDED TEXT CREATOR ===============
    class ExtrudedTextCreator {
      constructor() {
        // Font definitions for ASCII characters
        this.fontDefinitions = this.createFontDefinitions();
      }
      
      createFontDefinitions() {
        // Define paths for common ASCII characters using line segments
        // using VT100 monospaced terminal proportions (approx 1:2 width to height ratio)
        const definitions = {};
        
        // Define @ character - VT100 style (1:2 ratio)
        definitions['@'] = [
          // Outer circle - VT100 style ratio
          { x: 0, y: -0.8 }, { x: 0.4, y: -0.8 }, { x: 0.4, y: 0.8 }, 
          { x: -0.4, y: 0.8 }, { x: -0.4, y: -0.8 }, { x: 0, y: -0.8 },
          // Inner 'a' like shape 
          { move: { x: 0.2, y: 0 } },
          { x: 0, y: 0 }, { x: 0, y: 0.3 }, { x: 0.2, y: 0.3 },
          { x: 0.2, y: -0.3 }, { x: 0, y: -0.3 }
        ];
        
        // Define # character - VT100 style
        definitions['#'] = [
          // Horizontal lines
          { x: -0.4, y: -0.4 }, { x: 0.4, y: -0.4 },
          { move: { x: -0.4, y: 0.4 } }, { x: 0.4, y: 0.4 },
          // Vertical lines - taller for VT100 look
          { move: { x: -0.15, y: -0.8 } }, { x: -0.15, y: 0.8 },
          { move: { x: 0.15, y: -0.8 } }, { x: 0.15, y: 0.8 }
        ];
        
        // Define * character - VT100 style
        definitions['*'] = [
          // Star shape - VT100 proportions
          { x: 0, y: 0 }, { x: 0, y: -0.8 },
          { move: { x: 0, y: 0 } }, { x: 0.3, y: -0.6 },
          { move: { x: 0, y: 0 } }, { x: 0.4, y: 0 },
          { move: { x: 0, y: 0 } }, { x: 0.3, y: 0.6 },
          { move: { x: 0, y: 0 } }, { x: 0, y: 0.8 },
          { move: { x: 0, y: 0 } }, { x: -0.3, y: 0.6 },
          { move: { x: 0, y: 0 } }, { x: -0.4, y: 0 },
          { move: { x: 0, y: 0 } }, { x: -0.3, y: -0.6 }
        ];
        
        // Define + character - VT100 style
        definitions['+'] = [
          { x: -0.4, y: 0 }, { x: 0.4, y: 0 },
          { move: { x: 0, y: -0.8 } }, { x: 0, y: 0.8 }
        ];
        
        // Define : character - VT100 style
        definitions[':'] = [
          { x: 0, y: -0.5 }, { x: 0, y: -0.5 },
          { move: { x: 0, y: 0.5 } }, { x: 0, y: 0.5 }
        ];
        
        // Define = character - VT100 style
        definitions['='] = [
          { x: -0.4, y: -0.3 }, { x: 0.4, y: -0.3 },
          { move: { x: -0.4, y: 0.3 } }, { x: 0.4, y: 0.3 }
        ];
        
        // Define - character - VT100 style
        definitions['-'] = [
          { x: -0.4, y: 0 }, { x: 0.4, y: 0 }
        ];
        
        // Define % character - VT100 style
        definitions['%'] = [
          // Diagonal line - VT100 ratio
          { x: -0.4, y: 0.8 }, { x: 0.4, y: -0.8 },
          // Top right circle
          { move: { x: 0.2, y: -0.5 } }, { x: 0.2, y: -0.5 },
          // Bottom left circle
          { move: { x: -0.2, y: 0.5 } }, { x: -0.2, y: 0.5 }
        ];
        
        // Define . character - VT100 style
        definitions['.'] = [
          { x: 0, y: 0.6 }, { x: 0, y: 0.6 }
        ];
        
        // Default for any undefined character - VT100 style 1:2 ratio
        definitions['default'] = [
          { x: -0.4, y: -0.8 }, { x: 0.4, y: -0.8 }, 
          { x: 0.4, y: 0.8 }, { x: -0.4, y: 0.8 }, 
          { x: -0.4, y: -0.8 }
        ];
        
        return definitions;
      }
      
      // Create an extruded text shape for a character
      createExtrudedChar(char, group, size, depth, time) {
        const path = this.fontDefinitions[char] || this.fontDefinitions['default'];
        const color = getCharColor(char, time); // Pass time for shimmer effect
        
        // Create the main extruded shape
        const frontGroup = new Zdog.Group({
          addTo: group
        });
        
        // Front face
        const frontShape = new Zdog.Shape({
          addTo: frontGroup,
          path: path,
          stroke: 2,
          color: color,
          fill: true,
          closed: this.isClosedPath(path),
          scale: size
        });
        
        // Back face (positioned back by depth)
        const backShape = new Zdog.Shape({
          addTo: frontGroup,
          path: path,
          stroke: 2,
          color: getColorVariant(color, 0.7),
          fill: true,
          closed: this.isClosedPath(path),
          scale: size,
          translate: { z: -depth }
        });
        
        // Create side faces to connect front and back (extrusion)
        this.createSideFaces(path, frontGroup, size, depth, color);
        
        return {
          group: frontGroup,
          color: color,
          frontShape: frontShape,
          backShape: backShape
        };
      }
      
      // Create the side faces for extrusion
      createSideFaces(path, group, size, depth, color) {
        // Skip if path is too simple
        if (path.length < 2) return;
        
        const darkColor = getColorVariant(color, 0.6);
        const mediumColor = getColorVariant(color, 0.8);
        
        // Create sides by connecting corresponding points on front and back faces
        for (let i = 0; i < path.length - 1; i++) {
          const current = path[i];
          const next = path[i + 1];
          
          // Skip if this is a move command
          if (current.move || next.move) continue;
          
          // Create a side panel by defining the 4 corners
          const sidePath = [
            { x: current.x * size, y: current.y * size, z: 0 },
            { x: next.x * size, y: next.y * size, z: 0 },
            { x: next.x * size, y: next.y * size, z: -depth },
            { x: current.x * size, y: current.y * size, z: -depth }
          ];
          
          // Create the side panel
          new Zdog.Shape({
            addTo: group,
            path: sidePath,
            color: (i % 2 === 0) ? darkColor : mediumColor, // Alternate colors for cell-shading effect
            fill: true,
            closed: true,
            stroke: 1
          });
        }
      }
      
      // Check if the path should be closed
      isClosedPath(path) {
        if (path.length < 3) return false;
        
        // If any segment is a move command, the path is not inherently closed
        const hasMoveCommands = path.some(point => point.move);
        if (hasMoveCommands) return false;
        
        // Check if the first and last points are the same (closed shape)
        const first = path[0];
        const last = path[path.length - 1];
        return (first.x === last.x && first.y === last.y);
      }
      
      // Update the colors for shimmer effect
      updateShimmerColors(shapeObj, char, time) {
        const newColor = getCharColor(char, time);
        
        if (shapeObj.frontShape) {
          shapeObj.frontShape.color = newColor;
        }
        
        if (shapeObj.backShape) {
          shapeObj.backShape.color = getColorVariant(newColor, 0.7);
        }
        
        return newColor;
      }
    }

    // =============== PARTICLE MANAGER ===============
    class ParticleManager {
      constructor(illo, asciiGrid) {
        this.illo = illo;
        this.asciiGrid = asciiGrid;
        this.particles = [];
        this.mainGroup = new Zdog.Group({
          addTo: this.illo
        });
        this.characterGroups = getCharacterGroups();
        this.extrudedTextCreator = new ExtrudedTextCreator();
        this.highlightedParticle = null;
        this.rotationSpeed = 1.0; // Default rotation speed multiplier
        this.animationPaused = false;
        this.characterRotationEnabled = true;
        
        // Effect system
        this.effects = new ParticleEffects();
        this.effectIntensity = 1.0;
        
        // Mouse tracker for effects
        this.mouseX = 0;
        this.mouseY = 0;
        this.mouseActive = false;
        
        // GUI settings
        this.settings = {
          effect: 'spin',
          intensity: 1.0,
          rotationEnabled: true,
          rotationSpeed: 1.0,
          paused: false,
          resetView: () => this.resetView(),
          shimmerAmount: 0.6
        };
      }
      
      findMinMaxPositions() {
        // Find the min and max x,y positions by analyzing the grid
        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        
        // First pass: find min/max indexes of non-space characters
        for (let y = 0; y < this.asciiGrid.length; y++) {
          const row = this.asciiGrid[y];
          for (let x = 0; x < row.length; x++) {
            if (row[x].trim() !== '') {
              minX = Math.min(minX, x);
              maxX = Math.max(maxX, x);
              minY = Math.min(minY, y);
              maxY = Math.max(maxY, y);
            }
          }
        }
        
        return { minX, maxX, minY, maxY };
      }
      
      createParticles({ scale }) {
        this.particles = [];
        this.mainGroup.children = [];
        
        // Find the actual bounds of the ASCII art
        const { minX, maxX, minY, maxY } = this.findMinMaxPositions();
        
        // Calculate the center point of the ASCII art in grid coordinates
        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        
        // Save the scale for resizing purposes
        this.baseScale = scale;
        
        // Current time for initial shimmer effect
        const time = Date.now() / 1000;
        
        this.asciiGrid.forEach((row, y) => {
          row.forEach((char, x) => {
            if (char.trim() !== '') {
              // Position relative to the center of the ASCII art
              const relX = (x - centerX) * scale;
              const relY = (y - centerY) * scale;
              
              const particle = this.createParticle(char, relX, relY, scale, time);
              this.particles.push(particle);
            }
          });
        });
      }
      
      createParticle(char, x, y, scale, time) {
        const group = new Zdog.Group({
          addTo: this.mainGroup,
          translate: {
            x: x,
            y: y,
            z: 0
          }
        });
        
        // Create extruded character with depth
        const depth = scale * 0.12; // Less depth for VT100 terminal look
        const charObj = this.extrudedTextCreator.createExtrudedChar(char, group, scale * 0.4, depth, time);
        
        // Generate random rotation speeds and phases for each axis
        const rotationX = {
          speed: (0.2 + Math.random() * 0.8) * (Math.random() > 0.5 ? 1 : -1),
          phase: Math.random() * Math.PI * 2
        };
        
        const rotationY = {
          speed: (0.3 + Math.random() * 0.7) * (Math.random() > 0.5 ? 1 : -1),
          phase: Math.random() * Math.PI * 2
        };
        
        const rotationZ = {
          speed: (0.1 + Math.random() * 0.4) * (Math.random() > 0.5 ? 1 : -1),
          phase: Math.random() * Math.PI * 2
        };
        
        // Return the particle object with all properties
        return {
          char,
          group,
          shape: charObj.group,
          shapeObj: charObj, // Store for color updates
          originalX: x,
          originalY: y,
          originalZ: 0,
          originalColor: charObj.color,
          originalScale: { x: 1, y: 1, z: 1 },
          rotationX,
          rotationY,
          rotationZ,
          highlighted: false,
          
          // Screen position (updated during rendering)
          screenX: 0,
          screenY: 0,
          
          // Temporary effect values
          tempOffsetX: 0,
          tempOffsetY: 0,
          tempOffsetZ: 0,
          tempRotationX: 0,
          tempRotationY: 0,
          tempRotationZ: 0,
          tempScale: 1
        };
      }
      
      updateParticles(time) {
        if (this.animationPaused) return;
        
        // Get canvas dimensions for screen positioning
        const canvas = this.illo.element;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        // Apply effect from GUI if set
        if (this.settings.effect !== this.effects.getCurrentEffect()) {
          this.effects.setEffect(this.settings.effect);
        }
        
        // Update effect intensity from GUI
        this.effectIntensity = this.settings.intensity;
        
        // Update character rotation from GUI
        this.characterRotationEnabled = this.settings.rotationEnabled;
        
        // Update rotation speed from GUI
        this.rotationSpeed = this.settings.rotationSpeed;
        
        // Update animation paused state from GUI
        this.animationPaused = this.settings.paused;
        
        // If mouse is active, apply effects
        if (this.mouseActive) {
          this.effects.applyEffect(this.particles, this.mouseX, this.mouseY, this.effectIntensity);
        }
        
        this.particles.forEach(particle => {
          // Update shimmer colors with intensity from GUI
          if (particle.shapeObj) {
            particle.originalColor = this.extrudedTextCreator.updateShimmerColors(
              particle.shapeObj, 
              particle.char, 
              time
            );
          }
          
          // Apply rotation to each character
          if (this.characterRotationEnabled) {
            const rx = time * particle.rotationX.speed * this.rotationSpeed + particle.rotationX.phase;
            const ry = time * particle.rotationY.speed * this.rotationSpeed + particle.rotationY.phase;
            const rz = time * particle.rotationZ.speed * this.rotationSpeed + particle.rotationZ.phase;
            
            particle.shape.rotate.x = rx + particle.tempRotationX;
            particle.shape.rotate.y = ry + particle.tempRotationY;
            particle.shape.rotate.z = rz + particle.tempRotationZ;
          }
          
          // Apply temporary offsets
          particle.group.translate.x = particle.originalX + particle.tempOffsetX;
          particle.group.translate.y = particle.originalY + particle.tempOffsetY;
          particle.group.translate.z = particle.originalZ + particle.tempOffsetZ;
          
          // Apply temporary scale
          const scale = particle.highlighted ? 1.5 : particle.tempScale;
          particle.group.scale.x = scale;
          particle.group.scale.y = scale;
          particle.group.scale.z = scale;
          
          // Calculate screen position for this particle (for effect targeting)
          const screenX = centerX + particle.group.translate.x * this.mainGroup.scale.x;
          const screenY = centerY + particle.group.translate.y * this.mainGroup.scale.y;
          
          particle.screenX = screenX;
          particle.screenY = screenY;
          
          // Decay temporary effects
          particle.tempOffsetX *= 0.9;
          particle.tempOffsetY *= 0.9;
          particle.tempOffsetZ *= 0.9;
          particle.tempRotationX *= 0.9;
          particle.tempRotationY *= 0.9;
          particle.tempRotationZ *= 0.9;
          
          if (particle.tempScale > 1) {
            particle.tempScale = 1 + (particle.tempScale - 1) * 0.9;
          } else if (particle.tempScale < 1) {
            particle.tempScale = 1 - (1 - particle.tempScale) * 0.9;
          }
        });
      }
      
      zoomParticles(factor) {
        // Don't let the zoom get too small or too large
        const currentScale = this.mainGroup.scale.x;
        const newScale = Math.max(0.2, Math.min(5, currentScale * factor));
        
        this.mainGroup.scale.x = newScale;
        this.mainGroup.scale.y = newScale;
        this.mainGroup.scale.z = newScale;
      }
      
      highlightParticle(x, y) {
        // Reset previous highlight
        if (this.highlightedParticle) {
          this.highlightedParticle.highlighted = false;
        }
        
        // Find the particle closest to the given coordinates
        const closestParticle = this.findClosestParticle(x, y);
        
        if (closestParticle) {
          // Highlight the new particle
          closestParticle.highlighted = true;
          this.highlightedParticle = closestParticle;
        }
      }
      
      findClosestParticle(x, y) {
        let closestParticle = null;
        let closestDistance = Infinity;
        
        this.particles.forEach(particle => {
          const distance = Math.sqrt(
            (particle.screenX - x) ** 2 + 
            (particle.screenY - y) ** 2
          );
          
          if (distance < closestDistance) {
            closestDistance = distance;
            closestParticle = particle;
          }
        });
        
        // Only return if within a reasonable threshold
        const threshold = 50;
        return closestDistance < threshold ? closestParticle : null;
      }
      
      setMousePosition(x, y, active) {
        this.mouseX = x;
        this.mouseY = y;
        this.mouseActive = active;
      }
      
      resetView() {
        // Reset all particles to their original positions
        this.particles.forEach(particle => {
          particle.tempOffsetX = 0;
          particle.tempOffsetY = 0;
          particle.tempOffsetZ = 0;
          particle.tempRotationX = 0;
          particle.tempRotationY = 0;
          particle.tempRotationZ = 0;
          particle.tempScale = 1;
        });
        
        // Reset zoom
        this.mainGroup.scale.x = 1;
        this.mainGroup.scale.y = 1;
        this.mainGroup.scale.z = 1;
      }
    }

    // =============== MAIN APP ===============
    class AsciiParticleApp {
      constructor() {
        this.asciiGrid = parseAsciiArt();
        this.gridDimensions = getGridDimensions(this.asciiGrid);
        
        this.canvas = document.getElementById('zdog-canvas');
        this.isDragging = false;
        this.lastX = 0;
        this.lastY = 0;
        this.zoomLevel = 1;
        this.previousTime = 0;
        
        this.setupZdog();
        this.setupParticles();
        this.setupEventListeners();
        this.setupGUI();
        this.animate();
        
        // Show active effect
        this.updateEffectDisplay();
        
        console.log('ASCII Particle App initialized', {
          gridDimensions: this.gridDimensions,
          particleCount: this.particleManager.particles.length
        });
      }
      
      setupZdog() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        
        this.illo = new Zdog.Illustration({
          element: this.canvas,
          dragRotate: false,
          resize: true,
          zoom: 1,
        });
      }
      
      setupParticles() {
        // Calculate the best scale to fit the ASCII art in the window
        const padding = 100; // Increased padding for better visibility 
        const scaleX = (window.innerWidth - padding * 2) / this.gridDimensions.width;
        const scaleY = (window.innerHeight - padding * 2) / this.gridDimensions.height;
        const scale = Math.min(scaleX, scaleY) * 0.8; // Ensure it fits with some margin
        
        // Create or update the particle manager
        if (!this.particleManager) {
          this.particleManager = new ParticleManager(this.illo, this.asciiGrid);
          this.particleManager.createParticles({ scale });
        } else {
          // Recreate particles with new size
          this.particleManager.createParticles({ scale });
        }
      }
      
      setupGUI() {
        // Create GUI
        this.gui = new lil.GUI({ title: 'VT100 Controls' });
        
        // Add controls
        this.gui.add(this.particleManager.settings, 'effect', ['spin', 'explode', 'scatter', 'wave', 'pulse'])
          .name('Effect Type');
        
        this.gui.add(this.particleManager.settings, 'intensity', 0.1, 3)
          .name('Effect Intensity');
        
        this.gui.add(this.particleManager.settings, 'rotationEnabled')
          .name('Rotation Enabled');
        
        this.gui.add(this.particleManager.settings, 'rotationSpeed', 0.1, 3)
          .name('Rotation Speed');
        
        this.gui.add(this.particleManager.settings, 'shimmerAmount', 0.1, 1)
          .name('Shimmer Amount');
        
        this.gui.add(this.particleManager.settings, 'paused')
          .name('Pause Animation');
        
        this.gui.add(this.particleManager.settings, 'resetView')
          .name('Reset View');
          
        // Position the GUI in the top-right corner
        this.gui.domElement.style.position = 'absolute';
        this.gui.domElement.style.top = '10px';
        this.gui.domElement.style.right = '10px';
      }
      
      setupEventListeners() {
        // Mouse interactions
        this.canvas.addEventListener('mousedown', this.handleMouseDown.bind(this));
        window.addEventListener('mousemove', this.handleMouseMove.bind(this));
        window.addEventListener('mouseup', this.handleMouseUp.bind(this));
        
        // Touch interactions
        this.canvas.addEventListener('touchstart', this.handleMouseDown.bind(this), { passive: false });
        window.addEventListener('touchmove', this.handleMouseMove.bind(this), { passive: false });
        window.addEventListener('touchend', this.handleMouseUp.bind(this));
        
        // Zoom with mouse wheel
        this.canvas.addEventListener('wheel', this.handleWheel.bind(this), { passive: false });
        
        // Window resize
        window.addEventListener('resize', debounce(this.handleResize.bind(this), 250));
        
        // Prevent right-click menu
        this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      }
      
      handleMouseDown(event) {
        event.preventDefault();
        
        const pointer = getPointerPosition(event);
        this.lastX = pointer.x;
        this.lastY = pointer.y;
        
        // If it's a left click, check for highlight first
        if (event.button === 0 || event.touches) {
          this.particleManager.highlightParticle(pointer.x, pointer.y);
        }
        
        // Set active mouse state for effects
        this.particleManager.setMousePosition(pointer.x, pointer.y, true);
        
        this.isDragging = true;
      }
      
      handleMouseMove(event) {
        const pointer = getPointerPosition(event);
        
        // Update mouse position for effects
        this.particleManager.setMousePosition(pointer.x, pointer.y, this.isDragging);
        
        // Store last position
        this.lastX = pointer.x;
        this.lastY = pointer.y;
      }
      
      handleMouseUp() {
        this.isDragging = false;
        this.particleManager.setMousePosition(this.lastX, this.lastY, false);
      }
      
      handleWheel(event) {
        event.preventDefault();
        
        // Determine zoom direction
        const zoomFactor = event.deltaY < 0 ? 1.1 : 0.9;
        
        // Update zoom level
        this.zoomLevel *= zoomFactor;
        
        // Apply zoom to particles
        this.particleManager.zoomParticles(zoomFactor);
      }
      
      updateEffectDisplay() {
        // Update controls display to show current effect
        const currentEffect = this.particleManager.effects.getCurrentEffect();
        const controls = document.querySelector('.controls');
        controls.innerHTML = `Mouse: Click and drag to use <b>${currentEffect}</b> effect, Scroll to zoom`;
      }
      
      handleResize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        
        // Recalculate scaling to fit the window
        this.setupParticles();
      }
      
      animate(timestamp = 0) {
        const time = timestamp / 1000;
        
        // Update all particles
        this.particleManager.updateParticles(time);
        
        // Update the scene
        this.illo.updateRenderGraph();
        
        // Continue animation loop
        requestAnimationFrame(this.animate.bind(this));
      }
    }

    // Initialize when the document is ready
    document.addEventListener('DOMContentLoaded', () => {
      window.app = new AsciiParticleApp();
    });
  </script>
