# Single source of truth for secret scanning allowlists
# Run: python scripts/generate-security-configs.py to regenerate tool-specific configs

description: "Test fixtures and example credentials - intentionally committed"

paths:
  # Test certificates and keys for mTLS testing
  - tests/certs/*.key
  - tests/fixtures/crypto.py

  # Example keys for documentation/demos
  - examples/**/*.key
  - examples/grpc/server.key
  - example_certs_output/*.key
  - keys/flavor-private.key

  # Documentation with example credentials
  - docs/examples/*.md

  # Test output files
  - tests/rpcplugin-tests.txt
