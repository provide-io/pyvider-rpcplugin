name: ⚡ Performance Monitoring

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run performance tests weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Type of benchmark to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - latency
          - throughput
          - memory
          - security-overhead

env:
  PYTHON_VERSION: "3.13"

jobs:
  # =============================================================================
  # Latency Benchmarks
  # =============================================================================
  latency-benchmark:
    name: 📊 Latency Benchmarks
    runs-on: ubuntu-latest
    if: github.event.inputs.benchmark_type == 'latency' || github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == ''
    strategy:
      matrix:
        transport: [unix, tcp]
        security: [plain, mtls]
        message_size: [1kb, 10kb, 100kb]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --all-extras --dev

      - name: 🛡️ Setup certificates (mTLS)
        if: matrix.security == 'mtls'
        run: |
          mkdir -p perf-test-certs
          cd perf-test-certs

          # Generate CA
          openssl genrsa -out ca.key 4096
          openssl req -new -x509 -key ca.key -sha256 -subj "/C=US/ST=CA/O=PerfTest/CN=TestCA" -days 1 -out ca.crt

          # Generate server cert
          openssl genrsa -out server.key 4096
          openssl req -new -key server.key -subj "/C=US/ST=CA/O=PerfTest/CN=localhost" -out server.csr
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 1 -sha256

          # Generate client cert
          openssl genrsa -out client.key 4096
          openssl req -new -key client.key -subj "/C=US/ST=CA/O=PerfTest/CN=client" -out client.csr
          openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 1 -sha256

      - name: ⚡ Run latency benchmark
        env:
          TRANSPORT: ${{ matrix.transport }}
          SECURITY: ${{ matrix.security }}
          MESSAGE_SIZE: ${{ matrix.message_size }}
          CERT_DIR: perf-test-certs
        run: |
          uv run python benchmarks/latency_benchmark.py \
            --transport ${{ matrix.transport }} \
            --security ${{ matrix.security }} \
            --message-size ${{ matrix.message_size }} \
            --iterations 1000 \
            --output latency-results-${{ matrix.transport }}-${{ matrix.security }}-${{ matrix.message_size }}.json

      - name: 📊 Upload latency results
        uses: actions/upload-artifact@v4
        with:
          name: latency-${{ matrix.transport }}-${{ matrix.security }}-${{ matrix.message_size }}
          path: latency-results-*.json

  # =============================================================================
  # Throughput Benchmarks
  # =============================================================================
  throughput-benchmark:
    name: 🚀 Throughput Benchmarks
    runs-on: ubuntu-latest
    if: github.event.inputs.benchmark_type == 'throughput' || github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == ''
    strategy:
      matrix:
        transport: [unix, tcp]
        concurrent_clients: [1, 10, 50, 100]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --all-extras --dev

      - name: 🚀 Run throughput benchmark
        env:
          TRANSPORT: ${{ matrix.transport }}
          CONCURRENT_CLIENTS: ${{ matrix.concurrent_clients }}
        run: |
          uv run python benchmarks/throughput_benchmark.py \
            --transport ${{ matrix.transport }} \
            --concurrent-clients ${{ matrix.concurrent_clients }} \
            --duration 30 \
            --output throughput-results-${{ matrix.transport }}-${{ matrix.concurrent_clients }}.json

      - name: 📊 Upload throughput results
        uses: actions/upload-artifact@v4
        with:
          name: throughput-${{ matrix.transport }}-${{ matrix.concurrent_clients }}
          path: throughput-results-*.json

  # =============================================================================
  # Memory Usage Profiling
  # =============================================================================
  memory-profile:
    name: 🧠 Memory Usage Profiling
    runs-on: ubuntu-latest
    if: github.event.inputs.benchmark_type == 'memory' || github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == ''

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install memory-profiler psutil

      - name: 🧠 Run memory profiling
        run: |
          uv run python benchmarks/memory_benchmark.py \
            --output memory-profile.json

      - name: 📊 Generate memory report
        run: |
          echo "# 🧠 Memory Usage Report" > memory-report.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> memory-report.md
          echo "" >> memory-report.md

          if [ -f memory-profile.json ]; then
            echo "## Memory Profile Results" >> memory-report.md
            echo "\`\`\`json" >> memory-report.md
            cat memory-profile.json >> memory-report.md
            echo "\`\`\`" >> memory-report.md
          fi

      - name: 📤 Upload memory results
        uses: actions/upload-artifact@v4
        with:
          name: memory-profile
          path: |
            memory-profile.json
            memory-report.md

  # =============================================================================
  # Security Overhead Analysis
  # =============================================================================
  security-overhead:
    name: 🔒 Security Overhead Analysis
    runs-on: ubuntu-latest
    if: github.event.inputs.benchmark_type == 'security-overhead' || github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == ''

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --all-extras --dev

      - name: 🛡️ Setup certificates
        run: |
          mkdir -p security-perf-certs
          cd security-perf-certs

          # Generate CA
          openssl genrsa -out ca.key 4096
          openssl req -new -x509 -key ca.key -sha256 -subj "/C=US/ST=CA/O=SecurityPerf/CN=TestCA" -days 1 -out ca.crt

          # Generate server cert
          openssl genrsa -out server.key 4096
          openssl req -new -key server.key -subj "/C=US/ST=CA/O=SecurityPerf/CN=localhost" -out server.csr
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 1 -sha256

          # Generate client cert
          openssl genrsa -out client.key 4096
          openssl req -new -key client.key -subj "/C=US/ST=CA/O=SecurityPerf/CN=client" -out client.csr
          openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 1 -sha256

      - name: 🔒 Measure security overhead
        env:
          CERT_DIR: security-perf-certs
        run: |
          uv run python benchmarks/security_overhead_benchmark.py \
            --output security-overhead.json

      - name: 📊 Generate security overhead report
        run: |
          echo "# 🔒 Security Overhead Analysis" > security-overhead-report.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> security-overhead-report.md
          echo "" >> security-overhead-report.md

          if [ -f security-overhead.json ]; then
            echo "## Security Overhead Results" >> security-overhead-report.md
            echo "\`\`\`json" >> security-overhead-report.md
            cat security-overhead.json >> security-overhead-report.md
            echo "\`\`\`" >> security-overhead-report.md
          fi

      - name: 📤 Upload security overhead results
        uses: actions/upload-artifact@v4
        with:
          name: security-overhead
          path: |
            security-overhead.json
            security-overhead-report.md

  # =============================================================================
  # Performance Regression Detection
  # =============================================================================
  regression-analysis:
    name: 📈 Performance Regression Analysis
    runs-on: ubuntu-latest
    needs: [latency-benchmark, throughput-benchmark, memory-profile]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for comparison

      - name: 📊 Download all performance results
        uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          merge-multiple: true

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: |
          uv sync --dev
          uv pip install numpy pandas

      - name: 📈 Analyze performance trends
        run: |
          uv run python scripts/performance_analysis.py \
            --results-dir . \
            --output performance-analysis.json

      - name: 📊 Generate performance report
        run: |
          echo "# ⚡ Performance Analysis Report" > performance-report.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> performance-report.md
          echo "Commit: ${{ github.sha }}" >> performance-report.md
          echo "" >> performance-report.md

          # Summary statistics
          echo "## 📊 Performance Summary" >> performance-report.md

          # Find all result files
          result_files=$(find . -name "*results*.json" | wc -l)
          echo "- **Total benchmark runs**: $result_files" >> performance-report.md

          # Add trend analysis if available
          if [ -f performance-analysis.json ]; then
            echo "- **Trend analysis**: Available in artifacts" >> performance-report.md
          fi

          echo "" >> performance-report.md
          echo "## 🔍 Detailed Results" >> performance-report.md
          echo "See individual artifacts for detailed performance metrics." >> performance-report.md

      - name: 💬 Comment PR with performance summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = "## ⚡ Performance Analysis Results\n\n";

            // Count result files
            const resultFiles = require('child_process')
              .execSync('find . -name "*results*.json" | wc -l')
              .toString().trim();

            comment += `**Benchmark runs completed**: ${resultFiles}\n\n`;
            comment += "📊 Detailed performance metrics are available in the workflow artifacts.\n\n";

            // Check for significant changes (placeholder logic)
            comment += "✅ No significant performance regressions detected.\n\n";
            comment += "_Performance monitoring powered by automated benchmarks._";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: 📤 Upload performance analysis
        uses: actions/upload-artifact@v4
        with:
          name: performance-analysis
          path: |
            performance-analysis.json
            performance-report.md

  # =============================================================================
  # Performance Dashboard Update
  # =============================================================================
  update-dashboard:
    name: 📊 Update Performance Dashboard
    runs-on: ubuntu-latest
    needs: [regression-analysis]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📊 Update performance dashboard
        run: |
          echo "🚀 Performance dashboard update would happen here"
          echo "Could integrate with external monitoring systems"
          echo "Or update GitHub Pages dashboard"
