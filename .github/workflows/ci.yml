name: ⚙️ Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: provide-io/ci-tooling/.github/workflows/python-ci.yml@develop
    with:
      python-version: '3.11'
      coverage-threshold: 80
      run-security: true
      run-secret-scan: true
      matrix-testing: true
    secrets: inherit
