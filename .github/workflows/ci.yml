name: 🧪 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: ~/.cache/uv

jobs:
  # =============================================================================
  # Code Quality & Security
  # =============================================================================
  quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install bandit pyright

      - name: 🔒 Security scan (Bandit)
        run: |
          uv run bandit -r src/ -f json -o bandit-report.json || true
          uv run bandit -r src/ -f txt

      - name: 🎨 Code formatting (Ruff)
        run: |
          uv run ruff check src/ tests/ examples/
          uv run ruff format --check src/ tests/ examples/

      - name: 🧠 Type checking (Pyright)
        run: uv run pyright src/ tests/

      - name: 📋 Version consistency
        run: uv run python scripts/version_checker.py

      - name: 📊 Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  # =============================================================================
  # Testing Matrix
  # =============================================================================
  test:
    name: 🧪 Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14"]
        include:
          # Test with minimum supported Python version
          - os: ubuntu-latest
            python-version: "3.13"
            coverage: true

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --all-extras --dev

      - name: 🧪 Run tests
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then
            uv run pytest --cov=pyvider.rpcplugin --cov-report=xml --cov-report=html -v
          else
            uv run pytest -v
          fi
        shell: bash

      # - name: 📊 Upload coverage to Codecov
      #   if: matrix.coverage
      #   uses: codecov/codecov-action@v4
      #   with:
      #     file: ./coverage.xml
      #     fail_ci_if_error: false

      - name: 📈 Upload coverage artifacts
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # =============================================================================
  # RPC-Specific Testing
  # =============================================================================
  rpc-integration:
    name: 🔌 RPC Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        transport: [unix, tcp]
        security: [plain, mtls]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --all-extras --dev

      - name: 🛡️ Generate test certificates (mTLS)
        if: matrix.security == 'mtls'
        run: |
          mkdir -p test-certs
          # Generate CA key and certificate
          openssl genrsa -out test-certs/ca.key 4096
          openssl req -new -x509 -key test-certs/ca.key -sha256 -subj "/C=US/ST=CA/O=Test/CN=TestCA" -days 1 -out test-certs/ca.crt
          
          # Generate server key and certificate
          openssl genrsa -out test-certs/server.key 4096
          openssl req -new -key test-certs/server.key -subj "/C=US/ST=CA/O=Test/CN=localhost" -out test-certs/server.csr
          openssl x509 -req -in test-certs/server.csr -CA test-certs/ca.crt -CAkey test-certs/ca.key -CAcreateserial -out test-certs/server.crt -days 1 -sha256
          
          # Generate client key and certificate
          openssl genrsa -out test-certs/client.key 4096
          openssl req -new -key test-certs/client.key -subj "/C=US/ST=CA/O=Test/CN=client" -out test-certs/client.csr
          openssl x509 -req -in test-certs/client.csr -CA test-certs/ca.crt -CAkey test-certs/ca.key -CAcreateserial -out test-certs/client.crt -days 1 -sha256

      - name: 🔌 Test RPC Integration
        env:
          RPC_TRANSPORT: ${{ matrix.transport }}
          RPC_SECURITY: ${{ matrix.security }}
          CERT_DIR: test-certs
        run: |
          uv run pytest tests/integration/ -v \
            -k "test_${{ matrix.transport }}_${{ matrix.security }}" \
            --timeout=30

  # =============================================================================
  # Performance Benchmarking
  # =============================================================================
  performance:
    name: ⚡ Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --all-extras --dev

      - name: ⚡ Run benchmarks
        run: |
          uv run python benchmarks/latency_benchmark.py
          uv run python benchmarks/throughput_benchmark.py

      - name: 📊 Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  # =============================================================================
  # Documentation & Examples
  # =============================================================================
  docs:
    name: 📚 Documentation & Examples
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: |
          uv sync --all-extras --dev
          npm install -g markdown-link-check

      - name: 🔗 Check markdown links
        run: |
          find . -name "*.md" -not -path "./node_modules/*" | xargs markdown-link-check --config .mlc_config.json

      - name: 📖 Test examples
        run: |
          cd examples
          for example in 01_echo_demo.py 02_server_setup.py 03_client_connection.py; do
            echo "Testing $example..."
            timeout 30 uv run python "$example" || echo "Example $example completed or timed out (expected)"
          done

      - name: 🏗️ Test demo builds
        run: |
          cd examples/demo/echo_service
          uv run python server.py --help
          uv run python client.py --help || echo "Client help completed"

  # =============================================================================
  # Build & Package
  # =============================================================================
  build:
    name: 📦 Build & Package
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Build package
        run: |
          uv build

      - name: 🔍 Verify package
        run: |
          uv run twine check dist/*
          # Test package installation
          uv pip install dist/*.whl
          uv run python -c "import pyvider.rpcplugin; print(pyvider.rpcplugin.__version__)"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # =============================================================================
  # Release (only on published releases)
  # =============================================================================
  release:
    name: 🚀 Release to PyPI
    runs-on: ubuntu-latest
    needs: [quality, test, rpc-integration, docs, build]
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/pyvider-rpcplugin
    
    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: 📢 Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  # =============================================================================
  # Cleanup & Notifications
  # =============================================================================
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [quality, test, rpc-integration, docs]
    if: always()
    steps:
      - name: 📊 Report Status
        run: |
          echo "Pipeline Status Summary:"
          echo "Quality: ${{ needs.quality.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "RPC Integration: ${{ needs.rpc-integration.result }}"
          echo "Documentation: ${{ needs.docs.result }}"
