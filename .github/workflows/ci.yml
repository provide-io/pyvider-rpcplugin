name: continuous something or another

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: self-hosted
    #runs-on: pane-pyvider-rpcplugin
    #runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install uv
      - run: uv venv
      - run: source .venv/bin/activate
      - run: uv pip install -r requirements.txt
      - run: uv sync --all-extras --active
      - run: uv pip list
      - run: ruff check . || true
      - run: pyre check || true

  tests:
    runs-on: self-hosted
    #runs-on: pane-pyvider-rpcplugin
    #runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv venv
      - run: source .venv/bin/activate
      - run: uv pip install -r requirements.txt
      - run: uv sync --all-extras --active
      - run: uv pip list
      - run: uv run --active hatch test -p tests
