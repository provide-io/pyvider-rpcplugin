name: continuous something or another

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install uv hatch ruff pyre-check
      - run: uv venv
      - run: source .venv/bin/activate
      - run: uv pip install -r requirements.txt
      - run: uv sync --all-extras
      - run: ruff check .
      - run: pyre check

  tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv hatch
      - run: uv venv
      - run: source .venv/bin/activate
      - run: uv pip install -r requirements.txt
      - run: uv sync --all-extras
      - run: hatch test -p
