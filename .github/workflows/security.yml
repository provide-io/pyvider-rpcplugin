name: 🔐 Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:

jobs:
  security:
    name: 🔍 Security Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      
      - name: 📦 Install dependencies
        run: |
          uv venv
          uv pip install bandit safety pip-audit
      
      - name: 🔒 Run Bandit security scan
        run: |
          source .venv/bin/activate
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll
      
      - name: 🔍 Check for known vulnerabilities
        run: |
          source .venv/bin/activate
          pip-audit || true
      
      - name: 🔐 Check for hardcoded secrets (PR)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: 🔐 Check for hardcoded secrets (Push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

      - name: 🔐 Check for hardcoded secrets (Full Scan)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
      
      - name: 📤 Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json