name: 🔒 Security & Dependencies

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  # =============================================================================
  # Security Vulnerability Scanning
  # =============================================================================
  security-scan:
    name: 🛡️ Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install bandit safety pip-audit

      - name: 🔍 Bandit security scan
        run: |
          echo "🔒 Running Bandit security scan..."
          uv run bandit -r src/ -f json -o bandit-report.json
          uv run bandit -r src/ -f txt -o bandit-report.txt
          echo "📊 Bandit scan completed"

      - name: 🔐 Safety vulnerability check
        run: |
          echo "🔐 Checking for known vulnerabilities with Safety..."
          uv run safety check --json --output safety-report.json || true
          uv run safety check || echo "⚠️ Vulnerabilities found - see report"

      - name: 🔍 Pip-audit security scan
        run: |
          echo "🔍 Running pip-audit security scan..."
          uv run pip-audit --format=json --output=pip-audit-report.json || true
          uv run pip-audit || echo "⚠️ Vulnerabilities found - see report"

      - name: 🛡️ CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: 📤 Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            bandit-report.txt
            safety-report.json
            pip-audit-report.json

      - name: 💬 Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = "## 🔒 Security Scan Results\n\n";
            
            try {
              const banditData = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
              const issueCount = banditData.results.length;
              comment += `**Bandit**: ${issueCount} security issues found\n`;
            } catch (e) {
              comment += "**Bandit**: Scan completed\n";
            }
            
            try {
              const safetyData = JSON.parse(fs.readFileSync('safety-report.json', 'utf8'));
              comment += `**Safety**: ${safetyData.length} vulnerabilities found\n`;
            } catch (e) {
              comment += "**Safety**: Scan completed\n";
            }
            
            comment += "\n📊 Detailed reports available in workflow artifacts.";
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # =============================================================================
  # Dependency Analysis & Updates
  # =============================================================================
  dependency-review:
    name: 📦 Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC

  dependency-analysis:
    name: 📊 Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Generate dependency tree
        run: |
          uv sync --all-extras --dev
          echo "📋 Dependency Tree:" > dependency-analysis.md
          echo "\`\`\`" >> dependency-analysis.md
          uv pip tree >> dependency-analysis.md
          echo "\`\`\`" >> dependency-analysis.md

      - name: 🔍 Check for outdated dependencies
        run: |
          echo "" >> dependency-analysis.md
          echo "## 📅 Outdated Dependencies:" >> dependency-analysis.md
          echo "\`\`\`" >> dependency-analysis.md
          uv pip list --outdated >> dependency-analysis.md || echo "All dependencies up to date" >> dependency-analysis.md
          echo "\`\`\`" >> dependency-analysis.md

      - name: 📊 License analysis
        run: |
          uv pip install pip-licenses
          echo "" >> dependency-analysis.md
          echo "## ⚖️ License Summary:" >> dependency-analysis.md
          echo "\`\`\`" >> dependency-analysis.md
          uv run pip-licenses --summary >> dependency-analysis.md
          echo "\`\`\`" >> dependency-analysis.md

      - name: 📤 Upload dependency analysis
        uses: actions/upload-artifact@v4
        with:
          name: dependency-analysis
          path: dependency-analysis.md

  # =============================================================================
  # RPC Security Testing
  # =============================================================================
  rpc-security:
    name: 🔌 RPC Security Testing
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --all-extras --dev

      - name: 🛡️ Generate test certificates
        run: |
          mkdir -p security-test-certs
          cd security-test-certs
          
          # Generate CA
          openssl genrsa -out ca.key 4096
          openssl req -new -x509 -key ca.key -sha256 -subj "/C=US/ST=CA/O=SecurityTest/CN=TestCA" -days 1 -out ca.crt
          
          # Generate server cert
          openssl genrsa -out server.key 4096
          openssl req -new -key server.key -subj "/C=US/ST=CA/O=SecurityTest/CN=localhost" -out server.csr
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 1 -sha256
          
          # Generate client cert
          openssl genrsa -out client.key 4096
          openssl req -new -key client.key -subj "/C=US/ST=CA/O=SecurityTest/CN=client" -out client.csr
          openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 1 -sha256

      - name: 🔒 Test mTLS security
        env:
          CERT_DIR: security-test-certs
        run: |
          echo "🔒 Testing mTLS certificate validation..."
          uv run pytest tests/security/ -v -k "test_mtls" --timeout=30

      - name: 🚫 Test security failure modes
        run: |
          echo "🚫 Testing security failure scenarios..."
          uv run pytest tests/security/ -v -k "test_security_failure" --timeout=30

      - name: 🔐 Test transport security
        run: |
          echo "🔐 Testing transport layer security..."
          uv run pytest tests/security/ -v -k "test_transport_security" --timeout=30

  # =============================================================================
  # Automated Security Updates
  # =============================================================================
  security-updates:
    name: 🤖 Automated Security Updates
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: 🔄 Update dependencies
        run: |
          # Update to latest compatible versions
          uv sync --upgrade
          
          # Check if any changes were made
          if ! git diff --quiet uv.lock; then
            echo "dependencies_updated=true" >> $GITHUB_ENV
          else
            echo "dependencies_updated=false" >> $GITHUB_ENV
          fi

      - name: 🧪 Run security tests
        if: env.dependencies_updated == 'true'
        run: |
          uv run pytest tests/security/ -v --timeout=60

      - name: 📝 Create Pull Request
        if: env.dependencies_updated == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🔒 chore: update dependencies for security"
          title: "🔒 Automated Security Dependency Update"
          body: |
            ## 🔒 Automated Security Dependency Update
            
            This PR was automatically created to update dependencies for security reasons.
            
            ### Changes:
            - Updated dependencies to latest compatible versions
            - Security tests passed
            
            ### Review Checklist:
            - [ ] Review dependency changes in `uv.lock`
            - [ ] Verify all tests pass
            - [ ] Check for any breaking changes
            
            **Auto-generated by security workflow**
          branch: security/dependency-update-${{ github.run_number }}
          delete-branch: true

  # =============================================================================
  # Security Compliance Reporting
  # =============================================================================
  compliance-report:
    name: 📋 Security Compliance Report
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: [security-scan, dependency-analysis, rpc-security]
    steps:
      - name: 📥 Download security artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-report*"
          merge-multiple: true

      - name: 📊 Generate compliance report
        run: |
          echo "# 🔒 Security Compliance Report" > compliance-report.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> compliance-report.md
          echo "Commit: ${{ github.sha }}" >> compliance-report.md
          echo "" >> compliance-report.md
          
          echo "## 🛡️ Security Scan Summary" >> compliance-report.md
          if [ -f bandit-report.json ]; then
            echo "- ✅ Bandit scan completed" >> compliance-report.md
          fi
          if [ -f safety-report.json ]; then
            echo "- ✅ Safety vulnerability check completed" >> compliance-report.md
          fi
          if [ -f pip-audit-report.json ]; then
            echo "- ✅ Pip-audit scan completed" >> compliance-report.md
          fi
          
          echo "" >> compliance-report.md
          echo "## 📦 Dependency Status" >> compliance-report.md
          if [ -f dependency-analysis.md ]; then
            echo "- ✅ Dependency analysis completed" >> compliance-report.md
          fi
          
          echo "" >> compliance-report.md
          echo "## 🔌 RPC Security" >> compliance-report.md
          echo "- ✅ mTLS security tests passed" >> compliance-report.md
          echo "- ✅ Transport security validated" >> compliance-report.md
          
          echo "" >> compliance-report.md
          echo "---" >> compliance-report.md
          echo "*This report was automatically generated by the security workflow.*" >> compliance-report.md

      - name: 📤 Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report.md
