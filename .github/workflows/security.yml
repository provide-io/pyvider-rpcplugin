name: 🔐 Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:

jobs:
  security:
    name: 🔍 Security Analysis
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: 🐍 Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: 📦 Install UV
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          enable-cache: true

      # Bandit reads source rather than installed packages, so it needs an
      # environment of its own and not the project's. `safety` and `pip-audit`
      # used to be installed here too; the audit below no longer wants them in
      # anything it can see.
      - name: 📦 Install Bandit
        run: |
          uv venv
          uv pip install bandit

      - name: 🔒 Run Bandit security scan
        run: |
          source .venv/bin/activate
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll

      # Audits the resolved lock with pip-audit run from `uvx`. What ran here
      # before was `pip-audit || true` inside the virtualenv above -- which the
      # step above builds empty and fills with scanners, so it audited the
      # scanners and nothing else, and could not have failed if it had found
      # something. Both halves are fixed: the lock is the subject, and the exit
      # status is the gate.
      - name: 🔍 Audit the locked dependencies
        run: scripts/audit_dependencies.sh

      - name: 🔐 Check for hardcoded secrets (PR)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: 🔐 Check for hardcoded secrets (Push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

      - name: 🔐 Check for hardcoded secrets (Full Scan)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./

      - name: 📤 Upload security reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
