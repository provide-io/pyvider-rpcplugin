# .github/workflows/docs.yml
# Documentation building and deployment workflow
# MANUAL TRIGGER ONLY

name: 📚 Documentation

on:
  workflow_dispatch:
    inputs:
      deploy_to_pages:
        description: 'Deploy to GitHub Pages'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Documentation Build
  # =============================================================================
  build-docs:
    name: 🏗️ Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python & uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 🔧 Setup environment
        run: |
          chmod +x env.sh
          source ./env.sh

      - name: 📚 Install documentation dependencies
        run: |
          echo "📚 Installing documentation dependencies..."
          uv pip install \
            mkdocs \
            mkdocs-material \
            mkdocs-mermaid2-plugin \
            pymdown-extensions \
            mkdocs-include-markdown-plugin

      - name: 🏗️ Build documentation site
        run: |
          echo "🏗️ Building documentation site..."
          
          # Create comprehensive mkdocs.yml
          cat > mkdocs.yml << 'MKDOCS_EOF'
site_name: pyvider-rpcplugin Documentation
site_description: High-performance RPC plugin framework for Python 3.13+
site_author: provide.io
repo_url: https://github.com/provide-io/pyvider-rpcplugin
repo_name: provide-io/pyvider-rpcplugin
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - User Guide:
    - Architecture: guide/architecture.md
    - Configuration: guide/configuration.md
    - Transport Layer: guide/transport.md
    - Security: guide/security.md
    - Error Handling: guide/error-handling.md
  - Examples:
    - Basic Usage: examples/basic.md
    - RPC Server: examples/server.md
    - RPC Client: examples/client.md
    - mTLS Security: examples/mtls.md
    - Go Integration: examples/go-integration.md
  - API Reference:
    - Core: api/core.md
    - Server: api/server.md
    - Client: api/client.md
    - Transport: api/transport.md
    - Security: api/security.md
  - Development:
    - Contributing: development/contributing.md
    - Testing: development/testing.md
    - Release Process: development/release.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md

plugins:
  - search
  - mermaid2

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: provide-io
      repo: pyvider-rpcplugin
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/provide-io/pyvider-rpcplugin
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyvider-rpcplugin/
  version:
    provider: mike
MKDOCS_EOF
          
          # Create docs directory structure
          mkdir -p docs/{guide,examples,api,development}
          
          # Copy README as index
          cp README.md docs/index.md
          
          # Create placeholder documentation files
          cat > docs/quick-start.md << 'QS_EOF'
# Quick Start

Get up and running with pyvider-rpcplugin in minutes.

## Installation

```bash
pip install pyvider-rpcplugin
```

## Basic Example

```python
from pyvider.rpcplugin import plugin_server, plugin_protocol

# Your implementation here
```

More examples coming soon!
QS_EOF
          
          # Create other placeholder files
          echo "# Architecture Guide" > docs/guide/architecture.md
          echo "# Configuration Guide" > docs/guide/configuration.md
          echo "# Transport Layer" > docs/guide/transport.md
          echo "# Security Guide" > docs/guide/security.md
          echo "# Error Handling" > docs/guide/error-handling.md
          
          echo "# Basic Usage Examples" > docs/examples/basic.md
          echo "# RPC Server Examples" > docs/examples/server.md
          echo "# RPC Client Examples" > docs/examples/client.md
          echo "# mTLS Security Examples" > docs/examples/mtls.md
          echo "# Go Integration Examples" > docs/examples/go-integration.md
          
          echo "# Core API Reference" > docs/api/core.md
          echo "# Server API Reference" > docs/api/server.md
          echo "# Client API Reference" > docs/api/client.md
          echo "# Transport API Reference" > docs/api/transport.md
          echo "# Security API Reference" > docs/api/security.md
          
          echo "# Contributing Guide" > docs/development/contributing.md
          echo "# Testing Guide" > docs/development/testing.md
          echo "# Release Process" > docs/development/release.md
          
          echo "# Troubleshooting Guide" > docs/troubleshooting.md
          
          # Copy CHANGELOG if it exists
          if [[ -f CHANGELOG.md ]]; then
            cp CHANGELOG.md docs/changelog.md
          else
            echo "# Changelog" > docs/changelog.md
            echo "Documentation for changes will be maintained here." >> docs/changelog.md
          fi
          
          # Build the documentation
          mkdocs build --verbose

      - name: 📊 Documentation metrics
        run: |
          echo "📊 Documentation Statistics:"
          echo "============================"
          echo "📄 Total markdown files: $(find docs/ -name "*.md" | wc -l)"
          echo "📖 Total lines: $(find docs/ -name "*.md" | xargs wc -l | tail -1)"
          echo "🔤 Total words: $(find docs/ -name "*.md" | xargs wc -w | tail -1)"
          echo "📋 Examples: $(find examples/ -name "*.py" 2>/dev/null | wc -l)"
          echo "🎯 README sections: $(grep "^##" README.md | wc -l)"

      - name: 🔍 Validate documentation
        run: |
          echo "🔍 Validating documentation..."
          
          # Check for broken internal links (basic check)
          echo "🔗 Checking for basic markdown issues..."
          find docs/ -name "*.md" | while read -r file; do
            if grep -q "\[\[" "$file"; then
              echo "⚠️ Potential wiki-style link in $file"
            fi
          done
          
          # Validate that build directory exists and has content
          if [[ -d "site" && $(find site/ -name "*.html" | wc -l) -gt 0 ]]; then
            echo "✅ Documentation build successful: $(find site/ -name "*.html" | wc -l) HTML files generated"
          else
            echo "❌ Documentation build failed or no HTML files generated"
            exit 1
          fi

      - name: 📤 Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site/

  # =============================================================================
  # Deploy to GitHub Pages (Optional)
  # =============================================================================
  deploy-pages:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    if: inputs.deploy_to_pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📥 Download documentation artifacts
        uses: actions/download-artifact@v4
        with:
          name: documentation-site
          path: site/

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =============================================================================
  # Documentation Analysis
  # =============================================================================
  doc-analysis:
    name: 📈 Documentation Analysis
    runs-on: ubuntu-latest
    needs: build-docs
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📈 Generate documentation report
        run: |
          echo "📈 Documentation Analysis Report"
          echo "================================"
          echo ""
          echo "📊 Statistics:"
          echo "- Markdown files: $(find . -name "*.md" -not -path "./site/*" | wc -l)"
          echo "- Python examples: $(find examples/ -name "*.py" 2>/dev/null | wc -l)"
          echo "- Documentation sections: $(find docs/ -name "*.md" 2>/dev/null | wc -l)"
          echo ""
          echo "🎯 Content Quality:"
          echo "- README length: $(wc -l < README.md) lines"
          echo "- Has examples directory: $(if [[ -d "examples" ]]; then echo "✅ Yes"; else echo "❌ No"; fi)"
          echo "- Has changelog: $(if [[ -f "CHANGELOG.md" ]]; then echo "✅ Yes"; else echo "❌ No"; fi)"
          echo ""
          echo "🔗 Generated documentation available in artifacts"

      - name: 📋 Create documentation checklist
        run: |
          cat > doc-checklist.md << 'CHECKLIST_EOF'
# Documentation Checklist

## Core Documentation
- [x] README.md (primary documentation)
- [ ] Installation guide
- [ ] Quick start guide
- [ ] API reference
- [ ] Architecture documentation
- [ ] Security guide
- [ ] Troubleshooting guide

## Examples
- [ ] Basic usage examples
- [ ] Server implementation examples
- [ ] Client implementation examples
- [ ] Security (mTLS) examples
- [ ] Cross-language (Go) examples

## Development
- [ ] Contributing guidelines
- [ ] Testing documentation
- [ ] Release process
- [ ] Development setup

## Quality Checks
- [x] Documentation builds successfully
- [ ] All examples are tested
- [ ] Links are validated
- [ ] Code snippets are verified
- [ ] Screenshots/diagrams are current

Generated: $(date)
CHECKLIST_EOF
          
          echo "📋 Documentation checklist created: doc-checklist.md"

      - name: 📤 Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-analysis
          path: |
            doc-checklist.md
