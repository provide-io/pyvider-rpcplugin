syntax = "proto3";

package echo; // Changed from pyvider.testing.echo

// The echo service definition.
service EchoService { // Changed from Echoer
  // Sends a greeting
  rpc Echo (EchoRequest) returns (EchoResponse) {}
}

// The request message containing the user's name.
message EchoRequest {
  string message = 1;
}

// The response message containing the greetings
message EchoResponse {
  string reply = 1; // Changed from message
}
