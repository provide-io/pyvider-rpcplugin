syntax = "proto3";

package example13.externalmock;

option go_package = "example13/externalmock_pb";

message ExternalRequest {
    string data_from_A_via_broker = 1;
}

message ExternalResponse {
    string processed_external_data = 1;
}

// ExternalMockService: Represents a service outside the plugin, accessed via GRPCBroker
// The plugin will expose a client for this service, and another part of the system
// (or a mock within the client_app.py for this example) would implement this service.
service ExternalMockService {
    rpc ProcessExternalData(ExternalRequest) returns (ExternalResponse);
    rpc StreamExternalData(stream ExternalRequest) returns (stream ExternalResponse); // Example of streaming
}
