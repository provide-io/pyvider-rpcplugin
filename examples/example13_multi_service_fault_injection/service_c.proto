syntax = "proto3";

package example13.service_c;

option go_package = "example13/service_c_pb";

message RequestC {
    string input_data_from_B = 1;
}

message ResponseC {
    string processed_data_C = 1;
}

// ServiceC: Called by ServiceB
service ServiceC {
    rpc ProcessDataC(RequestC) returns (ResponseC);
}
