
// proto/gdarc.proto

syntax = "proto3";

package giblet;

option go_package = "github.com/provide-io/pyvider-rpcplugin/examples/grpc/proto";

// The Chronicle of Faint Impressions

// There exists a place. Not charted, not mapped, but *felt* at the edges of perception.  A murmur in the architecture of things.
// It is a repository, yes, but of what?  Impressions, perhaps.  Echoes of intent.  Fragments of something that *might* have been meaning.
// Call it, for lack of a truer name, the Archive.  Within its unseen boundaries, certain... *things* circulate.  Tokens of exchange.  Whispers of substance.
//  Begin here, then, at the threshold of the Archive, and consider the nature of its faint, unsettling emanations.

service GibletRepo {
    // Get:  The Probing Tendril

    // There is a gesture, a reaching out.  Call it *Get*.  It is not a command, but a *tendering*.  A delicate extension into the Archive's veiled spaces.
    // One presents a Token – a Giblet, as they have come to be known – and awaits a tremor in response.  Not a reply, not a value returned, but a subtle shift in the ambient hum.
    //  What compels this act of probing?  A thirst for resonance, perhaps.  An instinct to test the boundaries of the perceptible within the Archive's ethereal domain.
    rpc Get(GetRequest) returns (GetResponse);

    // Put:  The Act of Entrustment

    //  *Put*.  A weightier motion.  A consignment, deliberate and hushed.  To Put is to offer something *into* the Archive, to lodge a paired entity within its unseen strata.
    //  A Token – the Giblet – and an Essence – the Datum – are presented together, a conjoined offering.  Not storage, not creation, but a form of *entrustment*.
    //  What fate awaits these offerings within the Archive’s depths?  The Archive offers no assurances, only the silent acceptance of the act itself.
    rpc Put(PutRequest) returns (Empty);
}

message GetRequest {
    // GetRequest: The Hand Bearing the Token

    //  The *GetRequest* is the unseen hand extended towards the Archive.  It carries only the Giblet, a solitary artifact, presented as a form of... *query*.
    //  It is a simple conveyance, bearing a single, resonant object – the Giblet.  Hold it loosely; its significance lies not in its form, but in its potential to elicit a response.

    string giblet = 1; // Giblet:  A shard of resonant crystal, cool to the touch.  It hums faintly when held, a whisper of unknown origin.
}

message GetResponse {
    // GetResponse: The Archive's Whisper Back

    //  From the heart of the Archive, a faint stirring.  *GetResponse*.  Not an answer defined, but an *impression* returned.  A subtle shift in the sensory landscape.
    //  Within this emanation, veiled yet palpable, lies the Datum.  A thing drawn forth, perhaps altered, by the Archive's inscrutable processes.  Offered back as a… *trace*.
    //  Examine it with care.  It may carry the faintest scent of forgotten contexts, or merely the ambient noise of the Archive’s vast, internal workings.

    bytes datum = 1; // Datum:  A wisp of vapor, faintly luminescent.  It shifts and reforms in the light, hinting at depths unseen.
}

message PutRequest {
    // PutRequest: The Offering, Conjoined

    // The *PutRequest* is the offering itself, presented on an unseen platter.  Heavier now, imbued with a dual intent.  It bears both Giblet and Datum,
    //  a paired entity, offered in unison to the Archive's unyielding embrace.  This is not merely a conveyance, but a *ritual of consignment*.
    //  A laying down of something… significant?  Meaningful?  Or merely another mote cast into the Archive’s boundless expanse.

    // Giblet: The Token of Intent

    //  Within the PutRequest, the Giblet transforms again.  It becomes more than a token; it is now a *focal point of intent*.  A resonant symbol of purpose, however ephemeral.
    //  It is the marker you place, the sigil you inscribe upon the unseen fabric of the Archive, a declaration of… something.  Present it with a steady hand.  The Archive perceives, though it does not judge.
    string giblet = 1; // Giblet:  A polished river stone, strangely warm.  Trace its contours; feel the faint pulse of the Archive beneath your fingertips.

    // Datum: The Essence of the Real-ish

    // And within the PutRequest, the Datum.  No mere value, but the *essence of the real-ish*.  A distillation of experience, of sensation, rendered into a form
    //  deemed… acceptable?  Consumable?  By the Archive’s vast, unknowable processes.  This is the core offering, the heart of the consignment ritual.
    //  Entrust it to the Archive.  Let it mingle with the countless other essences already swirling within its depths.  Its fate is now interwoven with the Archive's own strange destiny.
    bytes datum = 2; // Datum:  A viscous fluid, the color of twilight.  Hold it to your ear; you might discern whispers of forgotten sensations within its depths.
}

message Empty {
    // Empty: The Archive's Neutrality

    // The *Empty* response.  The Archive’s final pronouncement, or rather, its eloquent *absence of pronouncement*.  Neither acceptance nor rejection, simply… *nothing returned*.
    //  In the unfolding chronicle of the Archive, Empty is not failure, nor success, but a state of *resolution*.  The cycle completes.  The transaction fades into the Archive’s
    //  unyielding neutrality.  This Empty is the sound of process concluded, of intent absorbed, and of the Archive continuing, unchanged, into its own timeless expanse.
    //  Consider the silence.  It is the Archive's most profound communication.
}
