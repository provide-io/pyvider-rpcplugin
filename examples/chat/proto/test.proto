
// proto/chat.proto

syntax = "proto3";
package chat;

option go_package = "github.com/provide-io/pyvider-rpcplugin/examples/chat/proto";

// chat.proto
//
// Version: 1.0
// Description:
//   This file defines the gRPC-based ChatService. It includes messages for
//   sending, receiving, and broadcasting chat messages, along with an RPC
//   for streaming communication.
//
//   The ChatService has three calls:
//     1) SendMessage        (unary RPC)
//     2) GetMessageHistory  (unary RPC)
//     3) ChatStream         (bidirectional streaming RPC)
//
//   The ChatMessage type encapsulates a user, message text, and a UNIX timestamp,
//   allowing for ordering. The SendMessageRequest and SendMessageResponse
//   types are used in the unary RPC to confirm that a message has been properly
//   sent and recorded.
//
//   The MessageHistoryRequest and MessageHistoryResponse are used to fetch a
//   repeated list of ChatMessages as the complete "history," typically returned
//   in a single shot for simplicity.
//
//   The ChatStream call uses a stream of ChatMessages in both directions,
//   enabling real-time communication among multiple clients. Each client
//   sends ChatMessages, while the server broadcasts these ChatMessages to
//   every connected client.
//
//   This proto is intended to be stable ("1.0") and suitable for production
//   usage, but always follow best practices for backward compatibility if you
//   expand the schema in subsequent versions.
//
// Package:
//   `chat` is the primary namespace.
//
// go_package option:
//   If generating Go code, the package name is configured for usage within
//   "github.com/provide-io/pyvider-rpcplugin/examples/chat/proto" 
//   so it can be properly imported by Go modules.

// -----------------------------------------------------------------------------
// Message Definitions
// -----------------------------------------------------------------------------

// ChatMessage:
//   Represents one chat message sent or received in the system.
//   Fields:
//     timestamp: A UNIX timestamp (in seconds) that indicates when
//                the message was sent. This helps clients order messages.
//     user:      The user (or system) who authored the message. 
//     message:   The textual content of the message.
message ChatMessage {
    int64 timestamp = 1;  // UNIX timestamp for message ordering
    string user = 2;      // The user or "SYSTEM" if server-generated
    string message = 3;   // The body of the chat message
}

// SendMessageRequest:
//   Used in a unary SendMessage RPC call to deliver a message.
//   Fields:
//     user:    Name or ID of the user sending the message.
//     message: The textual content.
message SendMessageRequest {
    string user = 1;
    string message = 2;
}

// SendMessageResponse:
//   Used in a unary SendMessage RPC call to acknowledge success or failure.
//   Fields:
//     success:        Whether the message was successfully processed.
//     error_message:  A textual error description if success == false.
message SendMessageResponse {
    bool success = 1;
    string error_message = 2; // Empty if success is true
}

// Empty:
//   An optional empty message structure for potential usage in your system.
//   Not strictly necessary, but can serve as a placeholder or future expansion.
message Empty {}

// MessageHistoryRequest:
//   A request to fetch the full chat history in a single shot. 
//   Typically used in a unary RPC to retrieve all stored messages at once.
message MessageHistoryRequest {}

// MessageHistoryResponse:
//   A response containing the entire chat history as a repeated list
//   of ChatMessages.
//   Fields:
//     messages: A repeated list of ChatMessage objects.
message MessageHistoryResponse {
    repeated ChatMessage messages = 1;
}

// -----------------------------------------------------------------------------
// Service Definition
// -----------------------------------------------------------------------------

// ChatService:
//   Defines three RPC methods for this chat system. 
//   1) SendMessage: A unary RPC that allows a client to send exactly one message
//      and receive a simple confirmation via SendMessageResponse.
//   2) GetMessageHistory: A unary RPC that fetches the entire chat history as a
//      single MessageHistoryResponse containing repeated ChatMessage objects.
//   3) ChatStream: A bidirectional streaming RPC. Both the client and server
//      exchange ChatMessage objects in real-time. This supports multi-client
//      broadcasting so that any message from one client is streamed to
//      all connected clients (including the sender), enabling real-time chat.
service ChatService {

    // 1) Send a single message via unary call.
    rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);

    // 2) Fetch the entire chat history in a single shot. Returns
    //    one MessageHistoryResponse with repeated messages.
    rpc GetMessageHistory(MessageHistoryRequest) returns (MessageHistoryResponse);

    // 3) Bidirectional streaming for real-time chat. The client sends a stream
    //    of ChatMessage objects, and the server returns a stream of ChatMessage
    //    objects (broadcast from any source).
    rpc ChatStream(stream ChatMessage) returns (stream ChatMessage);
}
