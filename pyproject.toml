#
# pyvider-rpcplugin/pyproject.toml
#

[project]
name = "pyvider-rpcplugin"
description = "Pyvider RPC Plugin"
dynamic = ["version"]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Tim Perkins", email = "code@tim.life" }
]
dependencies = [
    "attrs>=25.3.0",
    "cryptography>=45.0.7",
    "google>=3.0.0",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "protobuf>=5.29.3",
    "provide-foundation",
    "structlog>=25.3.0",
]

[project.urls]
Homepage = "https://foundry.provide.io/pyvider-rpcplugin/"
Documentation = "https://foundry.provide.io/pyvider-rpcplugin/"
Repository = "https://foundry.provide.io/pyvider-rpcplugin/repo"
Issues = "https://foundry.provide.io/pyvider-rpcplugin/issues"

[project.optional-dependencies]
test = [
    "grpc-stubs>=1.53.0.6",
    "grpcio-tools>=1.73.0",
    "types-grpcio>=1.0.0.20250603",
    "types-protobuf>=6.30.2.20250516",
]

[dependency-groups]
dev = [
    "mkdocs-autorefs>=1.4.3",
    "provide-testkit[standard,typecheck,advanced-testing,build,profiling,utils]",
    "pyvider-rpcplugin[test]",
]
docs = [
    "mkdocs-gen-files>=0.5.0",
    "provide-testkit[docs]",
]

[tool.pytest.ini_options]
log_cli = true
# log_cli_level = "DEBUG"

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]

markers = [
    "integration: marks tests as integration tests (deselect with -m \"not integration\")",
    "long_running: marks tests as long_running (deselect with -m \"not long_running\")",
    "slow: marks tests as slow (deselect with -m \"not slow\")"
]

filterwarnings = [
    "ignore:cannot collect test class .* because it has a __init__ constructor:pytest.PytestCollectionWarning",
    "ignore:.* KqueueSelector constructor:pytest.PytestCollectionWarning",
    # Python 3.13 asyncio cleanup ordering issue - not a bug in our code
    "ignore:Exception ignored in.*_SelectorTransport.__del__:pytest.PytestUnraisableExceptionWarning",
    # provide-testkit is auto-discovered and loaded before conftest imports - not an issue
    "ignore:Module already imported so cannot be rewritten; provide:pytest.PytestAssertRewriteWarning",
]

norecursedirs = [
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "**/*pb2*.py",
]
addopts = ""
# Parallel execution: pytest -n <workers> (range: 2-16, recommend: CPU cores or 8, max: 16 to avoid xdist hang)

################################################################################
# Ruff (Linter & Formatter)
################################################################################

[tool.ruff]
line-length = 111
indent-width = 4
target-version = "py311"
exclude = ["tests/*", "**/*pb2*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "C90", "SIM", "PTH", "RUF"]
ignore = ["ANN401", "B008", "E501", "RUF009"]

[tool.ruff.lint.isort]
known-first-party = ["pyvider", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"src/pyvider/rpcplugin/handshake/core.py" = ["C901"]
"src/pyvider/rpcplugin/handshake/negotiation.py" = ["C901"]
"src/pyvider/rpcplugin/protocol/service.py" = ["C901"]
"src/pyvider/rpcplugin/server/network.py" = ["C901"]
"src/pyvider/rpcplugin/transport/unix/transport.py" = ["C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

################################################################################
# coverage
################################################################################

[tool.coverage.run]
source = ["pyvider.rpcplugin"]
omit = [
    "**/*pb2*.py",
]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false  # Show all lines, even if 100% covered
precision = 2  # Decimal places in report output

[tool.coverage.html]
directory = "htmlcov"  # Output directory for HTML coverage reports

[tool.coverage.xml]
output = "coverage.xml"  # Output XML for CI/CD tools

[tool.coverage.annotate]
directory = "cover"  # Annotate files with coverage info

################################################################################
# pyre
################################################################################

[tool.pyre]
source_directories = ["src"]
exclude = [
    "tests/*",
    "**/*pb2.py",       # Generated protobuf Python
    "**/*pb2.pyi",      # Generated protobuf stubs
    "**/*pb2_grpc.py"   # Generated gRPC service stubs
]
strict = true

################################################################################
# mypy
################################################################################
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "google.protobuf.*",
    "grpc.*",
    "pytest.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pyvider.rpcplugin.protocol.grpc_stdio_pb2_grpc",
    "pyvider.rpcplugin.protocol.grpc_controller_pb2_grpc",
    "pyvider.rpcplugin.protocol.grpc_broker_pb2_grpc",
    "pyvider.rpcplugin.health_servicer",
]
ignore_errors = true

[[tool.mypy.overrides]]
# telemetry.py has type: ignore for OTEL fallback that only runs when OTEL is missing
module = "pyvider.rpcplugin.telemetry"
warn_unused_ignores = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyvider.rpcplugin" = ["py.typed"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

# 🐍🏗️📋

[tool.bandit]
exclude_dirs = [".venv", "tests", "workenv"]
