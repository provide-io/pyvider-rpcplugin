
# pyvider-rpcplugin/pyproject.toml

[project]
name = "pyvider-rpcplugin"
version = "0.1.1"
description = "Pyvider RPC Plugin"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Tim Perkins", email = "code@tim.life"}
]

dependencies = [
    "attrs>=25.1.0",
    "cryptography>=44.0.1",
    "google>=3.0.0",
    "protobuf>=5.29.3",
    "pytest-asyncio>=0.25.3",
    "structlog>=25.1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.3",
    "hatch>=1.14.0",
    "hypothesis>=6.127.1",
    "mypy>=1.15.0",
    "pynguin>=0.40.0",
    "pyre-check>=0.9.23",
    "pyre-extensions>=0.0.32",
    "pyright>=1.1.394",
    "pytest-asyncio>=0.25.3",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.0.0",
    "pytest-testmon>=2.1.3",
    "pytest-trace>=1.0.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.9.7",
    "sapp>=0.4",
    "tabulate>=0.9.0",
    "viztracer>=1.0.2",
]

telemetry = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-exporter-otlp-proto-common>=1.30.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation>=0.51b0",
    "opentelemetry-proto>=1.30.0",
]

################################################################################
# hatch
################################################################################

[tool.hatch.envs.default]
dependencies = []

[tool.hatch.envs.test.scripts]
#test = "pytest {args:tests}"
#coverage = "pytest --cov=pyvider.rpcplugin --cov-report=term-missing --cov-config=pyproject.toml"
lint = "ruff check src tests"
format = "ruff format src tests"
typecheck = "pyre check"
security = "bandit -r src"

[tool.hatch.envs.default.scripts]
test = "pytest -n auto --dist=loadscope"  # Parallel tests, no coverage by default
test-cov = "pytest -n auto --dist=loadscope --cov=your_module --cov-report=html"
run = "python -m pyvider.rpcplugin"

[tool.hatch.envs.go.scripts]
build = "(cd examples/kvprobo/go-rpc; ./build.sh)"
test = "(cd examples/kvprobo/go-rpc; ./build.sh)"

[tool.hatch.envs.docker.scripts]
build = "docker build -t pyvider-rpcplugin ."
run = "docker run --rm pyvider-rpcplugin"

[tool.hatch.metadata.targets.wheel]
packages = [
    { include = "pyvider.rpcplugin", from = "src" }
]

################################################################################
# pytest
################################################################################

[tool.pytest.ini_options]
log_cli = true
# log_cli_level = "DEBUG"

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

testpaths = ["tests"]
python_files = ["test_*.py"]

filterwarnings = [
    "ignore:cannot collect test class .* because it has a __init__ constructor:pytest.PytestCollectionWarning",
    "ignore:.* KqueueSelector constructor:pytest.PytestCollectionWarning",
]

norecursedirs = [
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "**/*pb2*.py",
    "*/logger/messages/*",
]

################################################################################
# lint
################################################################################

[tool.lint]
select = ["E", "F", "I", "UP", "ANN", "B"]
ignore = [
    "ANN401",
    "B008",
    "E501",
]
exclude = ["tests/*", "**/*pb2*.py"]
line-length = 88

################################################################################
# coverage
################################################################################

[tool.coverage.run]
source = ["pyvider.rpcplugin"]
branch = true
omit = [
    "*_pb2.py",
    "*/logger/*",
    "*/crypto/debug.py",
    "tests/*",
]

[tool.coverage.report]
# Improve report readability with missing lines
show_missing = true
skip_covered = false  # Show all lines, even if 100% covered
precision = 2  # Decimal places in report output

# Exclude logging statements and unnecessary code blocks
exclude_lines = [
    "logger\\.",  # Ignore all logger calls (debug, info, warning, error, critical)
    "import logging",  # Ignore logging import statements
    "from logging",  # Ignore logging module imports
    "raise NotImplementedError",  # Ignore abstract method placeholders
    "if __name__ == .__main__.:",  # Ignore main script execution guards
    "pass",  # Ignore no-op placeholders
    "pragma: no cover"  # Still allow manual exclusion of blocks
]

[tool.coverage.html]
directory = "htmlcov"  # Output directory for HTML coverage reports

[tool.coverage.xml]
output = "coverage.xml"  # Output XML for CI/CD tools

[tool.coverage.annotate]
directory = "cover"  # Annotate files with coverage info

################################################################################
# pyre
################################################################################

[tool.pyre]
source_directories = ["src"]
exclude = ["tests/*", "**/*pb2*.py"]
strict = true

